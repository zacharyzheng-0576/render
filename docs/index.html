<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>跨境电商卖家需求调研 | Cross-border Seller Survey</title>
  <link rel="stylesheet" href="style.css">
  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="survey-config.js"></script>
  <script src="data-service.js"></script>
</head>
<body>
  <!-- Landing Page -->
  <div class="landing-page" id="landingPage">
    <div class="landing-logo">📊</div>
    <h1 class="landing-title">跨境电商卖家需求调研</h1>
    <p class="landing-subtitle">Cross-border Seller Survey</p>
    <div class="survey-type-cards">
      <div class="survey-type-card shallow" onclick="startSurvey('shallow')">
        <div class="card-icon">⚡</div>
        <div class="card-title">快速调研</div>
        <div class="card-desc">了解您的核心需求</div>
        <div class="card-time">约5分钟 · 14题</div>
      </div>
      <div class="survey-type-card deep" onclick="startSurvey('deep')">
        <div class="card-icon">📋</div>
        <div class="card-title">深度调研</div>
        <div class="card-desc">全面了解您的业务细节</div>
        <div class="card-time">约10-15分钟 · 33题</div>
      </div>
    </div>
  </div>

  <!-- Survey Page -->
  <div class="survey-container" id="surveyPage" style="display:none">
    <!-- Back Button -->
    <button class="back-button" id="backButton" onclick="goBack()">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>

    <!-- Progress Header -->
    <div class="progress-header">
      <div class="progress-info">
        <span class="progress-text" id="progressText">1 / 14</span>
        <span class="progress-section" id="progressSection"></span>
      </div>
      <div class="progress-bar">
        <div class="fill" id="progressFill"></div>
      </div>
    </div>

    <!-- Question Container -->
    <div id="questionContainer"></div>

    <!-- Floating Continue Button (for multi-select and slider) -->
    <div class="floating-continue" id="floatingContinue">
      <button class="btn btn-primary" id="continueBtn" onclick="goNext()" disabled>
        继续 / Continue
      </button>
    </div>

    <!-- Success Page -->
    <div class="success-page" id="successPage">
      <div class="success-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="20 6 9 17 4 12"/>
        </svg>
      </div>
      <h2>感谢您的参与！</h2>
      <p>您的反馈对我们非常重要</p>
      <p class="en-sub">Thank you! Your feedback is very important to us.</p>
      <button class="continue-deep-btn" id="continueDeepBtn" onclick="continueDeepSurvey()" style="display:none">
        继续深度调研 / Continue to Detailed Survey
      </button>
    </div>
  </div>

  <script>
    // ============================================
    // Survey Engine
    // ============================================
    let surveyType = null; // 'shallow' or 'deep'
    let questions = [];
    let visibleQuestions = [];
    let currentStep = 0;
    let formData = {};
    let isSubmitting = false;

    // Section icons mapping
    const SECTION_ICONS = {
      'profile': '👤',
      'branch': '💼',
      'operations': '📦',
      'needs': '💡',
      'ai_tools': '🤖',
      'ad_creative': '📢',
      'validation': '✅',
      'contact': '📞'
    };

    // Start survey
    function startSurvey(type) {
      surveyType = type;
      const config = window.SURVEY_CONFIG[type];

      // Build question list
      if (type === 'shallow') {
        questions = config.questions;
      } else {
        // Deep survey: include shallow Q1-Q7 + deep-specific questions
        const shallowQuestions = window.SURVEY_CONFIG.shallow.questions;
        const shallowBase = shallowQuestions.filter(q => !q.deepOnly);
        const deepExtra = config.questions.filter(q => q.deepOnly);
        questions = [...shallowBase, ...deepExtra];
      }

      // Add survey_type to form data
      formData.survey_type = type;

      // Update UI
      document.getElementById('landingPage').style.display = 'none';
      document.getElementById('surveyPage').style.display = 'flex';

      // Calculate visible questions
      updateVisibleQuestions();
      showQuestion();

      // Track start time
      formData.started_at = new Date().toISOString();
    }

    // Update visible questions based on branch logic
    function updateVisibleQuestions() {
      visibleQuestions = questions.filter(q => {
        // Check branch condition
        if (q.branch) {
          const branchValue = formData[q.branch.field];
          if (Array.isArray(branchValue)) {
            return q.branch.values.some(v => branchValue.includes(v));
          }
          return q.branch.values.includes(branchValue);
        }
        return true;
      });
    }

    // Render a single question
    function renderQuestion(q) {
      const container = document.getElementById('questionContainer');

      // Section divider
      if (q.section && q.sectionTitle) {
        const prevQ = visibleQuestions[visibleQuestions.indexOf(q) - 1];
        if (!prevQ || prevQ.section !== q.section) {
          const sectionDiv = document.createElement('div');
          sectionDiv.className = 'section-divider-card';
          sectionDiv.innerHTML = `
            <div class="section-icon">${SECTION_ICONS[q.section] || '📝'}</div>
            <div class="section-title">${q.sectionTitle.zh}</div>
            <div class="section-subtitle">${q.sectionTitle.en}</div>
          `;
          container.appendChild(sectionDiv);

          // Auto-advance section divider after 800ms
          setTimeout(() => {
            sectionDiv.style.display = 'none';
          }, 800);
        }
      }

      // Question card
      const card = document.createElement('div');
      card.className = 'question-card';
      card.id = `question-${q.id}`;

      let html = `
        <div class="question-number">${getQuestionNumber(q)}</div>
        <div class="question-title">${q.zh}</div>
        <div class="question-en">${q.en}</div>
      `;

      if (q.hint) {
        html += `<div class="question-hint">${q.hint.zh} / ${q.hint.en}</div>`;
      }

      // Render based on type
      switch (q.type) {
        case 'single':
          html += renderSingleOptions(q);
          break;
        case 'multi':
          html += renderMultiOptions(q);
          break;
        case 'slider':
          html += renderSliders(q);
          break;
        case 'textarea':
          html += renderTextarea(q);
          break;
        case 'contact':
          html += renderContact(q);
          break;
      }

      card.innerHTML = html;
      container.appendChild(card);

      // Attach event listeners
      attachEventListeners(q, card);
    }

    // Render single-select options
    function renderSingleOptions(q) {
      let html = '<div class="options">';
      q.options.forEach(opt => {
        const selected = formData[q.field] === opt.value ? 'selected' : '';
        html += `
          <label class="option-label ${selected}" data-value="${opt.value}" data-field="${q.field}">
            <div class="option-radio"></div>
            <div class="option-content">
              <div class="option-text">${opt.zh}</div>
              ${opt.desc ? `<div class="option-desc">${opt.desc.zh}</div>` : ''}
              <div class="option-en">${opt.en}</div>
            </div>
            ${selected ? '<span class="option-check">✓</span>' : ''}
          </label>
        `;
        if (opt.hasOther) {
          const otherValue = formData[`${q.field}_other`] || '';
          html += `
            <div class="other-input ${selected && opt.value === '其他' ? 'show' : ''}">
              <input type="text" class="text-input" placeholder="请补充说明 / Please specify"
                     data-other-field="${q.field}_other" value="${otherValue}">
            </div>
          `;
        }
      });
      html += '</div>';
      return html;
    }

    // Render multi-select options
    function renderMultiOptions(q) {
      const selected = Array.isArray(formData[q.field]) ? formData[q.field] : [];
      let html = '';

      if (q.maxSelect) {
        html += `<div class="max-hint">已选 <span class="count">${selected.length}</span> / ${q.maxSelect}</div>`;
      }

      html += '<div class="options">';
      q.options.forEach(opt => {
        const isSelected = selected.includes(opt.value);
        html += `
          <label class="option-label ${isSelected ? 'selected' : ''}" data-value="${opt.value}" data-field="${q.field}">
            <div class="option-checkbox"></div>
            <div class="option-content">
              <div class="option-text">${opt.zh}</div>
              ${opt.desc ? `<div class="option-desc">${opt.desc.zh}</div>` : ''}
              <div class="option-en">${opt.en}</div>
            </div>
          </label>
        `;
        if (opt.hasOther) {
          const otherValue = formData[`${q.field}_other`] || '';
          html += `
            <div class="other-input ${isSelected ? 'show' : ''}">
              <input type="text" class="text-input" placeholder="请补充说明 / Please specify"
                     data-other-field="${q.field}_other" value="${otherValue}">
            </div>
          `;
        }
      });
      html += '</div>';
      return html;
    }

    // Render sliders
    function renderSliders(q) {
      let html = '<div class="slider-group">';
      q.fields.forEach(f => {
        const value = formData[f.field] || q.default;
        html += `
          <div class="slider-item">
            <div class="slider-label">
              <div>
                <div class="slider-label-text">${f.zh}</div>
                <div class="slider-label-en">${f.en}</div>
              </div>
              <div class="slider-value">${value}</div>
            </div>
            <input type="range" min="${q.min}" max="${q.max}" value="${value}"
                   data-field="${f.field}" oninput="updateSliderValue(this)">
          </div>
        `;
      });
      html += '</div>';
      return html;
    }

    // Render textarea
    function renderTextarea(q) {
      const value = formData[q.field] || '';
      return `
        <textarea class="textarea-input" data-field="${q.field}"
                  placeholder="${q.placeholder.zh} / ${q.placeholder.en}">${value}</textarea>
      `;
    }

    // Render contact question
    function renderContact(q) {
      const selected = formData[q.field];
      let html = '<div class="options">';
      q.options.forEach(opt => {
        const isSelected = selected === opt.value;
        html += `
          <label class="option-label ${isSelected ? 'selected' : ''}" data-value="${opt.value}" data-field="${q.field}">
            <div class="option-radio"></div>
            <div class="option-content">
              <div class="option-text">${opt.zh}</div>
              <div class="option-en">${opt.en}</div>
            </div>
            ${isSelected ? '<span class="option-check">✓</span>' : ''}
          </label>
        `;
      });
      html += '</div>';

      // Contact fields
      const showContact = selected === '愿意';
      html += `<div class="contact-section ${showContact ? 'show' : ''}" id="contactSection">`;
      html += '<div class="contact-fields">';
      html += '<div class="contact-label">方便的话请留下至少一项联系方式 / Please leave at least one contact method</div>';
      q.contactFields.forEach(f => {
        const value = formData[f.field] || '';
        html += `<input type="text" class="text-input" placeholder="${f.placeholder.zh} / ${f.placeholder.en}" data-field="${f.field}" value="${value}">`;
      });
      html += '</div></div>';

      return html;
    }

    // Attach event listeners
    function attachEventListeners(q, card) {
      // Single-select options
      if (q.type === 'single' || q.type === 'contact') {
        card.querySelectorAll('.option-label').forEach(label => {
          label.addEventListener('click', () => {
            const value = label.dataset.value;
            const field = label.dataset.field;

            // Update selection
            card.querySelectorAll('.option-label').forEach(l => {
              l.classList.remove('selected');
              l.querySelector('.option-check')?.remove();
            });
            label.classList.add('selected');
            label.insertAdjacentHTML('beforeend', '<span class="option-check">✓</span>');

            // Update form data
            formData[field] = value;

            // Handle "Other" input
            const otherInput = label.closest('.options').querySelector('.other-input');
            if (otherInput) {
              const hasOther = q.options.find(o => o.value === value)?.hasOther;
              otherInput.classList.toggle('show', hasOther);
            }

            // Handle contact section
            if (q.type === 'contact' && q.contactFields) {
              const contactSection = card.querySelector('.contact-section');
              contactSection.classList.toggle('show', value === '愿意');
            }

            // Update continue button for single-select
            updateContinueButton();

            // Auto-advance for single-select (not contact, not "Other")
            if (q.type === 'single') {
              const isOtherOption = q.options.find(o => o.value === value)?.hasOther;
              if (!isOtherOption) {
                setTimeout(() => {
                  goNext();
                }, 150);
              } else {
                // Focus on the other input
                setTimeout(() => {
                  const otherInput = card.querySelector('.other-input.show input');
                  if (otherInput) otherInput.focus();
                }, 200);
              }
            }
          });
        });
      }

      // Multi-select options
      if (q.type === 'multi') {
        card.querySelectorAll('.option-label').forEach(label => {
          label.addEventListener('click', () => {
            const value = label.dataset.value;
            const field = label.dataset.field;
            const maxSelect = q.maxSelect || 99;

            // Toggle selection
            if (label.classList.contains('selected')) {
              label.classList.remove('selected');
              formData[field] = (formData[field] || []).filter(v => v !== value);
            } else {
              if ((formData[field] || []).length >= maxSelect) {
                // Flash hint
                const hint = card.querySelector('.max-hint');
                if (hint) {
                  hint.style.color = '#FF3B30';
                  setTimeout(() => hint.style.color = '', 500);
                }
                return;
              }
              label.classList.add('selected');
              formData[field] = [...(formData[field] || []), value];
            }

            // Update count
            const countEl = card.querySelector('.max-hint .count');
            if (countEl) {
              countEl.textContent = (formData[field] || []).length;
            }

            // Handle "Other" input
            const otherInput = label.querySelector('.other-input') || label.nextElementSibling;
            if (otherInput?.classList.contains('other-input')) {
              otherInput.classList.toggle('show', label.classList.contains('selected'));
            }

            // Show/hide continue button
            updateContinueButton();
          });
        });
      }

      // Slider inputs
      if (q.type === 'slider') {
        card.querySelectorAll('input[type="range"]').forEach(slider => {
          slider.addEventListener('input', () => {
            formData[slider.dataset.field] = parseInt(slider.value);
            updateContinueButton();
          });
        });
      }

      // Textarea
      if (q.type === 'textarea') {
        const textarea = card.querySelector('textarea');
        textarea.addEventListener('input', () => {
          formData[q.field] = textarea.value;
          updateContinueButton();
        });
      }

      // Text inputs (other fields, contact)
      card.querySelectorAll('.text-input').forEach(input => {
        input.addEventListener('input', () => {
          formData[input.dataset.field] = input.value;
          // Update continue button when typing in "Other" input
          if (input.closest('.other-input')) {
            updateContinueButton();
          }
        });
      });
    }

    // Update slider value display
    function updateSliderValue(slider) {
      const valueDisplay = slider.parentElement.querySelector('.slider-value');
      valueDisplay.textContent = slider.value;
    }

    // Update continue button visibility
    function updateContinueButton() {
      const q = visibleQuestions[currentStep];
      if (!q) return;

      const floatingContinue = document.getElementById('floatingContinue');
      const continueBtn = document.getElementById('continueBtn');
      const isLastQuestion = currentStep >= visibleQuestions.length - 1;

      // Check if single-select with "Other" selected
      if (q.type === 'single') {
        const selectedValue = formData[q.field];
        const isOtherSelected = q.options.find(o => o.value === selectedValue)?.hasOther;
        if (isOtherSelected) {
          floatingContinue.classList.toggle('visible', true);
          continueBtn.disabled = false;
          continueBtn.textContent = isLastQuestion ? '提交 / Submit' : '继续 / Continue';
          continueBtn.className = isLastQuestion ? 'btn btn-submit' : 'btn btn-primary';
          return;
        }
        floatingContinue.classList.remove('visible');
        return;
      }

      if (q.type === 'multi') {
        const selected = formData[q.field] || [];
        const hasSelection = selected.length > 0;
        floatingContinue.classList.toggle('visible', true);
        continueBtn.disabled = !hasSelection;
        continueBtn.textContent = isLastQuestion ? '提交 / Submit' : '继续 / Continue';
        continueBtn.className = isLastQuestion ? 'btn btn-submit' : 'btn btn-primary';
      } else if (q.type === 'slider') {
        const hasChanged = q.fields.some(f => formData[f.field] !== undefined);
        floatingContinue.classList.toggle('visible', true);
        continueBtn.disabled = !hasChanged;
        continueBtn.textContent = isLastQuestion ? '提交 / Submit' : '继续 / Continue';
        continueBtn.className = isLastQuestion ? 'btn btn-submit' : 'btn btn-primary';
      } else if (q.type === 'textarea') {
        const hasContent = formData[q.field] && formData[q.field].trim().length > 0;
        floatingContinue.classList.toggle('visible', true);
        continueBtn.disabled = !hasContent;
        continueBtn.textContent = isLastQuestion ? '提交 / Submit' : '继续 / Continue';
        continueBtn.className = isLastQuestion ? 'btn btn-submit' : 'btn btn-primary';
      } else if (q.type === 'contact') {
        floatingContinue.classList.toggle('visible', true);
        continueBtn.disabled = false;
        continueBtn.textContent = isLastQuestion ? '提交 / Submit' : '继续 / Continue';
        continueBtn.className = isLastQuestion ? 'btn btn-submit' : 'btn btn-primary';
      } else {
        floatingContinue.classList.remove('visible');
      }
    }

    // Get question number
    function getQuestionNumber(q) {
      const idx = visibleQuestions.indexOf(q);
      return `Q${idx + 1}`;
    }

    // Show current question
    function showQuestion() {
      const container = document.getElementById('questionContainer');
      container.innerHTML = '';

      if (currentStep >= visibleQuestions.length) {
        submitSurvey();
        return;
      }

      const q = visibleQuestions[currentStep];
      renderQuestion(q);

      // Update progress
      updateProgress();

      // Update back button
      document.getElementById('backButton').classList.toggle('visible', currentStep > 0);

      // Update continue button
      updateContinueButton();

      // Scroll to top
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // Update progress
    function updateProgress() {
      const total = visibleQuestions.length;
      const current = currentStep + 1;
      const percent = (current / total) * 100;

      document.getElementById('progressText').textContent = `${current} / ${total}`;
      document.getElementById('progressFill').style.width = `${percent}%`;

      // Update section name
      const q = visibleQuestions[currentStep];
      if (q?.sectionTitle) {
        document.getElementById('progressSection').textContent = q.sectionTitle.zh;
      }
    }

    // Go to next question
    function goNext() {
      // Collect any pending inputs
      collectCurrentInputs();

      if (currentStep >= visibleQuestions.length - 1) {
        submitSurvey();
        return;
      }

      // Animate out
      const currentCard = document.getElementById(`question-${visibleQuestions[currentStep].id}`);
      if (currentCard) {
        currentCard.classList.add('slide-out');
      }

      setTimeout(() => {
        currentStep++;
        updateVisibleQuestions();
        showQuestion();
      }, 250);
    }

    // Go to previous question
    function goBack() {
      if (currentStep <= 0) return;

      collectCurrentInputs();
      currentStep--;
      showQuestion();
    }

    // Collect current inputs
    function collectCurrentInputs() {
      const q = visibleQuestions[currentStep];
      if (!q) return;

      // Collect other inputs
      document.querySelectorAll('.other-input.show input').forEach(input => {
        if (input.value.trim()) {
          formData[input.dataset.field] = input.value.trim();
        }
      });

      // Collect contact inputs
      document.querySelectorAll('.contact-section.show input').forEach(input => {
        if (input.value.trim()) {
          formData[input.dataset.field] = input.value.trim();
        }
      });

      // Collect textarea
      if (q.type === 'textarea') {
        const textarea = document.querySelector(`#question-${q.id} textarea`);
        if (textarea) {
          formData[q.field] = textarea.value;
        }
      }
    }

    // Submit survey
    async function submitSurvey() {
      if (isSubmitting) return;
      isSubmitting = true;

      // Collect final inputs
      collectCurrentInputs();

      // Add completion time
      formData.completed_at = new Date().toISOString();

      try {
        // Check network
        if (!navigator.onLine) {
          throw new Error('网络已断开，请检查网络连接后重试');
        }

        // Submit with retry
        const result = await submitWithRetry(formData);

        if (result.success) {
          showSuccessPage();
        } else {
          throw new Error(result.error || '提交失败');
        }
      } catch (err) {
        alert(err.message || '提交失败，请稍后重试');
        console.error('Submit error:', err);
      } finally {
        isSubmitting = false;
      }
    }

    // Submit with retry
    async function submitWithRetry(data, maxRetries = 2) {
      for (let i = 0; i <= maxRetries; i++) {
        try {
          return await window.CrossPilotData.submitResponse(data);
        } catch (err) {
          if (i === maxRetries) throw err;
          await new Promise(r => setTimeout(r, 1000));
        }
      }
    }

    // Show success page
    function showSuccessPage() {
      document.getElementById('questionContainer').style.display = 'none';
      document.getElementById('floatingContinue').style.display = 'none';
      document.getElementById('backButton').style.display = 'none';
      document.getElementById('progressFill').style.width = '100%';

      const successPage = document.getElementById('successPage');
      successPage.style.display = 'block';

      // Show "Continue to deep survey" button if shallow
      if (surveyType === 'shallow') {
        document.getElementById('continueDeepBtn').style.display = 'inline-block';
      }
    }

    // Continue to deep survey
    function continueDeepSurvey() {
      surveyType = 'deep';
      const deepConfig = window.SURVEY_CONFIG.deep;
      const shallowQuestions = window.SURVEY_CONFIG.shallow.questions;
      const shallowBase = shallowQuestions.filter(q => !q.deepOnly);
      const deepExtra = deepConfig.questions.filter(q => q.deepOnly);
      questions = [...shallowBase, ...deepExtra];

      formData.survey_type = 'deep';

      // Reset UI
      document.getElementById('successPage').style.display = 'none';
      document.getElementById('questionContainer').style.display = 'block';
      document.getElementById('floatingContinue').style.display = 'block';
      document.getElementById('backButton').style.display = 'block';

      // Start from where shallow ended (skip Q1-Q7)
      currentStep = shallowBase.length;
      updateVisibleQuestions();
      showQuestion();
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
      // Prevent zoom on double tap
      document.addEventListener('touchend', (e) => {
        const now = Date.now();
        if (now - (window.lastTouchEnd || 0) < 300) {
          e.preventDefault();
        }
        window.lastTouchEnd = now;
      }, false);
    });
  </script>
</body>
</html>
