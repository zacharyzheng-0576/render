<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>跨境电商卖家需求调研 | Cross-border Seller Survey</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            'apple': ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', 'Arial', 'sans-serif']
          }
        }
      }
    }
  </script>
  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="survey-config.js"></script>
  <script src="data-service.js"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'SF Pro Icons', 'PingFang SC', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background-color: #F5F5F7;
      color: #1D1D1F;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      overflow-x: hidden;
    }

    /* View transitions */
    .view-screen {
      transition: opacity 0.5s ease, transform 0.5s ease;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .view-hidden {
      opacity: 0;
      transform: translateY(20px) scale(0.98);
      pointer-events: none;
      z-index: 0;
    }
    .view-active {
      opacity: 1;
      transform: translateY(0) scale(1);
      pointer-events: auto;
      z-index: 10;
    }

    /* Card styles */
    .apple-card {
      background: #FFFFFF;
      border-radius: 20px;
      box-shadow: 0 2px 20px rgba(0, 0, 0, 0.04);
    }

    .apple-card-hover {
      transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    .apple-card-hover:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.08);
    }

    /* Button styles */
    .apple-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 12px 24px;
      border-radius: 980px;
      font-size: 17px;
      font-weight: 600;
      letter-spacing: -0.01em;
      transition: all 0.2s ease;
      cursor: pointer;
      border: none;
      outline: none;
    }

    .apple-btn-primary {
      background-color: #0071E3;
      color: #FFFFFF;
    }
    .apple-btn-primary:hover:not(:disabled) {
      background-color: #0077ED;
    }
    .apple-btn-primary:active:not(:disabled) {
      transform: scale(0.98);
    }
    .apple-btn-primary:disabled {
      background-color: #0071E3;
      opacity: 0.4;
      cursor: not-allowed;
    }

    .apple-btn-secondary {
      background-color: #0071E3;
      color: #FFFFFF;
    }
    .apple-btn-secondary:hover {
      background-color: #0077ED;
    }

    .apple-btn-text {
      background: none;
      color: #0071E3;
      padding: 8px 12px;
    }
    .apple-btn-text:hover {
      background-color: rgba(0, 113, 227, 0.08);
    }

    /* Content animation */
    .content-slide {
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.25, 1, 0.5, 1);
    }

    /* Option styles */
    .option-item {
      position: relative;
      padding: 16px 20px;
      border-radius: 14px;
      background: #F5F5F7;
      border: 2px solid transparent;
      cursor: pointer;
      transition: all 0.2s ease;
      -webkit-tap-highlight-color: transparent;
    }
    .option-item:hover {
      background: #E8E8ED;
    }
    .option-item:active {
      transform: scale(0.98);
    }
    .option-item.selected {
      border-color: #0071E3;
      background: rgba(0, 113, 227, 0.04);
    }

    .option-radio {
      width: 22px;
      height: 22px;
      border: 2px solid #C7C7CC;
      border-radius: 50%;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .option-item.selected .option-radio {
      border-color: #0071E3;
      background: #0071E3;
    }

    .option-check {
      width: 22px;
      height: 22px;
      border: 2px solid #C7C7CC;
      border-radius: 6px;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }
    .option-item.selected .option-check {
      border-color: #0071E3;
      background: #0071E3;
    }

    /* Slider styles */
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 6px;
      background: #E5E5EA;
      border-radius: 3px;
      outline: none;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 28px;
      height: 28px;
      background: #FFFFFF;
      border: 2px solid #0071E3;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.1);
    }

    /* Input styles */
    .apple-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid #E5E5EA;
      border-radius: 10px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.2s ease;
      background: #FFFFFF;
    }
    .apple-input:focus {
      border-color: #0071E3;
    }
    .apple-input::placeholder {
      color: #AEAEB2;
    }

    /* Other input animation */
    .other-input-wrapper {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.3s ease, opacity 0.2s ease, margin 0.3s ease;
      opacity: 0;
      margin-top: 0;
    }
    .other-input-wrapper.show {
      max-height: 60px;
      opacity: 1;
      margin-top: 12px;
    }

    /* Contact animation */
    .contact-wrapper {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s ease, opacity 0.3s ease;
      opacity: 0;
    }
    .contact-wrapper.show {
      max-height: 250px;
      opacity: 1;
    }

    /* Progress bar */
    .progress-bar {
      height: 3px;
      background: #E5E5EA;
      border-radius: 2px;
      overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: #0071E3;
      border-radius: 2px;
      transition: width 0.4s ease;
    }

    /* Error toast */
    .error-toast {
      position: fixed;
      bottom: 32px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #FF3B30;
      color: white;
      padding: 12px 24px;
      border-radius: 980px;
      font-size: 15px;
      font-weight: 500;
      box-shadow: 0 4px 12px rgba(255, 59, 48, 0.3);
      opacity: 0;
      transition: all 0.3s ease;
      z-index: 100;
    }
    .error-toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }
  </style>
</head>
<body class="relative min-h-screen">

  <!-- VIEW 1: 首页 -->
  <div id="view-home" class="view-screen view-active">
    <div class="w-full max-w-3xl text-center">
      <div class="mb-6">
        <span class="inline-block px-4 py-1.5 bg-[#0071E3]/10 text-[#0071E3] text-sm font-semibold rounded-full tracking-wide">
          Crosspilot AI
        </span>
      </div>
      <h1 class="text-[32px] md:text-[44px] font-bold tracking-tight text-[#1D1D1F] mb-4 leading-tight">
        跨境电商卖家需求调研
      </h1>
      <p class="text-lg md:text-xl text-[#86868B] mb-12 max-w-xl mx-auto leading-relaxed">
        了解您的核心需求与业务痛点，帮助我们为您提供更精准的服务。
      </p>

      <div class="grid md:grid-cols-2 gap-5 w-full">
        <!-- 快速调研 -->
        <div class="apple-card apple-card-hover p-7 md:p-8 text-left cursor-pointer" onclick="startSurvey('shallow')">
          <div class="w-12 h-12 rounded-2xl bg-blue-50 flex items-center justify-center mb-5">
            <svg class="w-6 h-6 text-[#0071E3]" fill="currentColor" viewBox="0 0 20 20">
              <path fill-rule="evenodd" d="M11.3 1.046A1 1 0 0112 2v5h4a1 1 0 01.82 1.573l-7 10A1 1 0 018 18v-5H4a1 1 0 01-.82-1.573l7-10a1 1 0 011.12-.381z" clip-rule="evenodd"/>
            </svg>
          </div>
          <h3 class="text-xl font-semibold text-[#1D1D1F] mb-2">快速调研</h3>
          <p class="text-[15px] text-[#86868B] mb-6 leading-relaxed">
            聚焦核心业务指标，快速评估您的基本需求与现状。
          </p>
          <div class="flex items-center justify-between">
            <span class="text-xs font-medium text-[#86868B] bg-[#F5F5F7] px-3 py-1.5 rounded-full">
              约 5 分钟 · 12 题
            </span>
            <span class="text-[#0071E3] text-sm font-medium flex items-center gap-1">
              开始
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
              </svg>
            </span>
          </div>
        </div>

        <!-- 深度调研 -->
        <div class="apple-card apple-card-hover p-7 md:p-8 text-left cursor-pointer" onclick="startSurvey('deep')">
          <div class="w-12 h-12 rounded-2xl bg-purple-50 flex items-center justify-center mb-5">
            <svg class="w-6 h-6 text-purple-600" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
              <path stroke-linecap="round" stroke-linejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/>
            </svg>
          </div>
          <h3 class="text-xl font-semibold text-[#1D1D1F] mb-2">深度调研</h3>
          <p class="text-[15px] text-[#86868B] mb-6 leading-relaxed">
            全面剖析业务细节与痛点，为您匹配高度定制化的解决方案。
          </p>
          <div class="flex items-center justify-between">
            <span class="text-xs font-medium text-[#86868B] bg-[#F5F5F7] px-3 py-1.5 rounded-full">
              约 10 分钟 · 25 题
            </span>
            <span class="text-purple-600 text-sm font-medium flex items-center gap-1">
              开始
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
              </svg>
            </span>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- VIEW 2: 答题页面 -->
  <div id="view-survey" class="view-screen view-hidden">
    <div class="apple-card w-full max-w-2xl flex flex-col overflow-hidden">
      <!-- Progress -->
      <div class="px-6 pt-5 pb-4 md:px-8 md:pt-6 md:pb-5">
        <div class="flex justify-between items-center mb-3">
          <div class="flex items-center gap-3">
            <span class="text-xs font-bold text-[#0071E3]">Crosspilot AI</span>
            <span class="text-[10px] text-[#C7C7CC]">|</span>
            <span id="progress-text" class="text-xs font-semibold text-[#86868B] tracking-wider uppercase">进度 1 / 12</span>
          </div>
          <button onclick="exitSurvey()" class="w-8 h-8 rounded-full flex items-center justify-center hover:bg-gray-100 transition-colors">
            <svg class="w-5 h-5 text-[#86868B]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
          </button>
        </div>
        <div class="progress-bar">
          <div id="progress-fill" class="progress-fill" style="width: 0%"></div>
        </div>
      </div>

      <!-- Content -->
      <div class="flex-1 px-6 pb-6 md:px-8 md:pb-8 overflow-y-auto" style="min-height: 380px; max-height: 60vh;">
        <!-- Section Header (inline) -->
        <div id="section-header" class="hidden"></div>

        <!-- Question Area -->
        <div id="question-area">
          <div id="question-number" class="text-xs font-bold text-[#0071E3] tracking-widest uppercase mb-3"></div>
          <h2 id="question-title" class="text-[22px] md:text-[26px] font-semibold text-[#1D1D1F] mb-1.5 leading-snug tracking-tight"></h2>
          <p id="question-en" class="text-[15px] text-[#86868B] mb-1.5"></p>
          <p id="question-hint" class="text-[13px] text-[#AEAEB2] mb-6 hidden"></p>

          <!-- Options -->
          <div id="options-container" class="space-y-2.5"></div>

          <!-- Sliders -->
          <div id="slider-container" class="hidden space-y-7"></div>

          <!-- Textarea -->
          <div id="textarea-container" class="hidden">
            <textarea id="textarea-input" class="apple-input min-h-[140px] resize-none text-[15px] leading-relaxed"></textarea>
          </div>

          <!-- Contact -->
          <div id="contact-container" class="hidden">
            <div id="contact-options" class="space-y-2.5 mb-4"></div>
            <div id="contact-fields" class="contact-wrapper">
              <div class="p-5 bg-[#F5F5F7] rounded-2xl space-y-3 mt-4">
                <p class="text-[13px] text-[#86868B] mb-1">请留下至少一项联系方式</p>
                <input type="text" id="contact-wechat" class="apple-input" placeholder="微信号 / WeChat ID">
                <input type="text" id="contact-phone" class="apple-input" placeholder="手机号 / Phone">
                <input type="text" id="contact-email" class="apple-input" placeholder="邮箱 / Email">
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Navigation -->
      <div class="px-6 py-5 md:px-8 md:py-6 border-t border-gray-100 flex justify-between items-center bg-white rounded-b-2xl">
        <button id="prev-btn" onclick="goBack()" class="apple-btn-text hidden">
          <svg class="w-4 h-4 mr-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
          </svg>
          上一题
        </button>
        <div id="prev-spacer"></div>
        <button id="next-btn" class="apple-btn apple-btn-primary px-8 py-3" disabled>
          继续
        </button>
      </div>
    </div>
  </div>

  <!-- VIEW 3: 感谢页面 -->
  <div id="view-thanks" class="view-screen view-hidden">
    <div class="w-full max-w-md text-center">
      <div class="w-20 h-20 rounded-full bg-blue-50 flex items-center justify-center mx-auto mb-8">
        <svg class="w-10 h-10 text-[#0071E3]" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
        </svg>
      </div>
      <h1 class="text-[32px] md:text-[40px] font-bold text-[#1D1D1F] mb-4 tracking-tight">感谢您的参与！</h1>
      <p class="text-lg text-[#86868B] mb-4 leading-relaxed">
        您的反馈对我们极其宝贵，我们将仔细分析并以此优化服务。
      </p>
      <p class="text-[15px] text-[#AEAEB2] mb-10">
        — Crosspilot AI 团队
      </p>
      <div class="flex flex-col sm:flex-row gap-3 justify-center">
        <button id="btn-continue-deep" onclick="continueToDeep()" class="apple-btn apple-btn-primary hidden">
          继续深度调研
        </button>
        <button onclick="goHome()" class="apple-btn apple-btn-secondary">
          返回首页
        </button>
      </div>
    </div>
  </div>

  <!-- Error Toast -->
  <div id="error-toast" class="error-toast"></div>

  <script>
    // ============================================
    // Survey Engine
    // ============================================
    let surveyType = null;
    let questions = [];
    let visibleQuestions = [];
    let currentStep = 0;
    let formData = {};
    let isSubmitting = false;

    const SECTION_ICONS = {
      'profile': '👤',
      'branch': '💼',
      'ai_scenarios': '🤖',
      'ai_attitude': '💡',
      'listing_details': '📦',
      'ad_creative': '📢',
      'feature_validation': '✅',
      'pricing': '💰',
      'contact': '📞'
    };

    function switchView(targetViewId) {
      ['view-home', 'view-survey', 'view-thanks'].forEach(id => {
        const el = document.getElementById(id);
        el.classList.toggle('view-active', id === targetViewId);
        el.classList.toggle('view-hidden', id !== targetViewId);
      });
    }

    let continueFromShallow = false;
    let pendingShallowData = null; // 存储待提交的浅度数据

    function startSurvey(type, isContinue = false) {
      surveyType = type;
      continueFromShallow = isContinue;
      isLastQuestionAnswered = false;
      lastQuestionClicked = false;
      const config = window.SURVEY_CONFIG[type];

      if (type === 'shallow') {
        questions = config.questions.filter(q => !q.deepOnly);
      } else {
        const shallowBase = window.SURVEY_CONFIG.shallow.questions.filter(q => !q.deepOnly && !q.shallowOnly);
        const deepExtra = config.questions.filter(q => q.deepOnly);
        questions = [...shallowBase, ...deepExtra];
      }

      // 如果是从浅度继续深度，保留之前的 formData
      if (!isContinue) {
        formData = { survey_type: type, started_at: new Date().toISOString() };
      } else {
        formData.survey_type = type;
      }

      currentStep = 0;
      updateVisibleQuestions();

      // 如果是从浅度继续，跳到第一个未回答的深度问题
      if (isContinue) {
        let firstUnanswered = -1;
        for (let i = 0; i < visibleQuestions.length; i++) {
          const q = visibleQuestions[i];
          if (!formData[q.field]) {
            firstUnanswered = i;
            break;
          }
        }
        // 如果有未回答的问题，跳到第一个未回答的
        if (firstUnanswered >= 0) {
          currentStep = firstUnanswered;
        } else {
          // 如果所有问题都已回答，跳到最后一题
          currentStep = visibleQuestions.length - 1;
        }
      }

      switchView('view-survey');
      showQuestion();
    }

    function exitSurvey() {
      if (confirm("确定要退出吗？进度将不会保留。")) {
        switchView('view-home');
      }
    }

    function updateVisibleQuestions() {
      visibleQuestions = questions.filter(q => {
        // 从浅度继续深度时，过滤掉联系方式问题
        if (continueFromShallow && q.type === 'contact') {
          return false;
        }
        // 分支逻辑
        if (!q.branch) return true;
        const val = formData[q.branch.field];
        return Array.isArray(val)
          ? q.branch.values.some(v => val.includes(v))
          : q.branch.values.includes(val);
      });
    }

    function showQuestion() {
      // 如果超出范围，回到最后一题（不自动提交）
      if (currentStep >= visibleQuestions.length) {
        currentStep = visibleQuestions.length - 1;
      }

      const q = visibleQuestions[currentStep];
      const total = visibleQuestions.length;

      // Progress
      document.getElementById('progress-text').textContent = `进度 ${currentStep + 1} / ${total}`;
      document.getElementById('progress-fill').style.width = `${((currentStep + 1) / total) * 100}%`;

      renderQuestion(q);
    }

    function renderQuestion(q) {
      // Section header - show on every question that has a section
      const sectionHeader = document.getElementById('section-header');
      if (q.section && q.sectionTitle) {
        sectionHeader.classList.remove('hidden');
        sectionHeader.innerHTML = `
          <div class="flex items-center gap-2 mb-4 pb-3 border-b border-gray-100">
            <span class="text-lg">${SECTION_ICONS[q.section] || '📝'}</span>
            <span class="text-sm font-semibold text-[#86868B]">${q.sectionTitle.zh}</span>
          </div>
        `;
      } else {
        sectionHeader.classList.add('hidden');
      }

      document.getElementById('question-number').textContent = `Q${currentStep + 1}`;
      document.getElementById('question-title').textContent = q.zh;
      document.getElementById('question-en').textContent = q.en;

      const hintEl = document.getElementById('question-hint');
      if (q.hint) {
        hintEl.textContent = `${q.hint.zh} / ${q.hint.en}`;
        hintEl.classList.remove('hidden');
      } else {
        hintEl.classList.add('hidden');
      }

      // Hide all containers
      ['options-container', 'slider-container', 'textarea-container', 'contact-container'].forEach(id => {
        document.getElementById(id).classList.add('hidden');
      });

      // Render by type
      const renderers = {
        'single': renderSingleOptions,
        'multi': renderMultiOptions,
        'slider': renderSliders,
        'textarea': renderTextarea,
        'contact': renderContact
      };
      renderers[q.type]?.(q);

      updateNavigation();
      animateIn();
    }

    function animateIn() {
      const el = document.getElementById('question-area');
      el.style.transition = 'none';
      el.style.transform = 'translateX(20px)';
      el.style.opacity = '0';
      void el.offsetWidth;
      el.style.transition = 'opacity 0.3s ease, transform 0.3s cubic-bezier(0.25, 1, 0.5, 1)';
      el.style.transform = 'translateX(0)';
      el.style.opacity = '1';
    }

    // ============================================
    // Single Select
    // ============================================
    function renderSingleOptions(q) {
      const container = document.getElementById('options-container');
      container.classList.remove('hidden');
      container.innerHTML = '';

      q.options.forEach(opt => {
        const isSelected = formData[q.field] === opt.value;
        const div = document.createElement('div');

        div.innerHTML = `
          <div class="option-item ${isSelected ? 'selected' : ''}" data-value="${opt.value}">
            <div class="flex items-center gap-3.5">
              <div class="option-radio flex items-center justify-center">
                ${isSelected ? '<div class="w-2.5 h-2.5 rounded-full bg-white"></div>' : ''}
              </div>
              <div class="flex-1 min-w-0">
                <div class="text-[15px] font-medium text-[#1D1D1F]">${opt.zh}</div>
                ${opt.desc ? `<div class="text-[13px] text-[#86868B] mt-0.5">${opt.desc.zh}</div>` : ''}
                <div class="text-[13px] text-[#AEAEB2]">${opt.en}</div>
              </div>
            </div>
          </div>
          ${opt.hasOther ? `
            <div class="other-input-wrapper ${isSelected && opt.value === '其他' ? 'show' : ''}">
              <input type="text" class="apple-input other-text-input" placeholder="请补充说明 / Please specify" data-field="${q.field}_other" value="${formData[q.field + '_other'] || ''}">
            </div>
          ` : ''}
        `;

        // Click on entire option area
        const optionEl = div.querySelector('.option-item');
        optionEl.addEventListener('click', (e) => {
          // Don't trigger if clicking on input
          if (e.target.tagName === 'INPUT') return;

          formData[q.field] = opt.value;

          // Update all options
          container.querySelectorAll('.option-item').forEach(item => {
            item.classList.remove('selected');
            const radio = item.querySelector('.option-radio');
            radio.innerHTML = '';
          });

          // Update selected
          optionEl.classList.add('selected');
          optionEl.querySelector('.option-radio').innerHTML = '<div class="w-2.5 h-2.5 rounded-full bg-white"></div>';

          // Handle "Other"
          const otherWrapper = div.querySelector('.other-input-wrapper');
          if (otherWrapper) {
            if (opt.value === '其他') {
              otherWrapper.classList.add('show');
              setTimeout(() => otherWrapper.querySelector('input').focus(), 300);
            } else {
              otherWrapper.classList.remove('show');
            }
          }

          // Auto-advance (not for "Other")
          if (!opt.hasOther || opt.value !== '其他') {
            setTimeout(() => goNext(), 200);
          } else {
            updateNavigation();
          }
        });

        // Other input
        const otherInput = div.querySelector('.other-text-input');
        if (otherInput) {
          otherInput.addEventListener('input', () => {
            formData[q.field + '_other'] = otherInput.value;
            updateNavigation();
          });
          otherInput.addEventListener('focus', () => {
            // Ensure option stays selected
            optionEl.classList.add('selected');
          });
        }

        container.appendChild(div);
      });
    }

    // ============================================
    // Multi Select
    // ============================================
    function renderMultiOptions(q) {
      const container = document.getElementById('options-container');
      container.classList.remove('hidden');
      container.innerHTML = '';

      const selected = Array.isArray(formData[q.field]) ? formData[q.field] : [];

      if (q.maxSelect) {
        const hint = document.createElement('div');
        hint.className = 'text-[13px] text-[#86868B] mb-4';
        hint.id = 'max-hint';
        hint.innerHTML = `已选 <span class="font-semibold text-[#0071E3]">${selected.length}</span> / ${q.maxSelect}`;
        container.appendChild(hint);
      }

      q.options.forEach(opt => {
        const isSelected = selected.includes(opt.value);
        const div = document.createElement('div');

        div.innerHTML = `
          <div class="option-item ${isSelected ? 'selected' : ''}" data-value="${opt.value}">
            <div class="flex items-center gap-3.5">
              <div class="option-check flex items-center justify-center">
                ${isSelected ? '<svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>' : ''}
              </div>
              <div class="flex-1 min-w-0">
                <div class="text-[15px] font-medium text-[#1D1D1F]">${opt.zh}</div>
                ${opt.desc ? `<div class="text-[13px] text-[#86868B] mt-0.5">${opt.desc.zh}</div>` : ''}
                <div class="text-[13px] text-[#AEAEB2]">${opt.en}</div>
              </div>
            </div>
          </div>
          ${opt.hasOther ? `
            <div class="other-input-wrapper ${isSelected ? 'show' : ''}">
              <input type="text" class="apple-input other-text-input" placeholder="请补充说明 / Please specify" data-field="${q.field}_other" value="${formData[q.field + '_other'] || ''}">
            </div>
          ` : ''}
        `;

        const optionEl = div.querySelector('.option-item');
        optionEl.addEventListener('click', (e) => {
          if (e.target.tagName === 'INPUT') return;

          let current = Array.isArray(formData[q.field]) ? [...formData[q.field]] : [];

          if (current.includes(opt.value)) {
            current = current.filter(v => v !== opt.value);
          } else {
            if (q.maxSelect && current.length >= q.maxSelect) {
              flashHint();
              return;
            }
            current.push(opt.value);
          }

          formData[q.field] = current;

          // Update UI
          optionEl.classList.toggle('selected', current.includes(opt.value));
          const check = optionEl.querySelector('.option-check');
          check.innerHTML = current.includes(opt.value)
            ? '<svg class="w-3.5 h-3.5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7"/></svg>'
            : '';

          // Update hint
          const hint = document.getElementById('max-hint');
          if (hint) {
            hint.innerHTML = `已选 <span class="font-semibold text-[#0071E3]">${current.length}</span> / ${q.maxSelect}`;
          }

          // Other
          const otherWrapper = div.querySelector('.other-input-wrapper');
          if (otherWrapper) {
            otherWrapper.classList.toggle('show', current.includes(opt.value) && opt.value === '其他');
          }

          updateNavigation();
        });

        container.appendChild(div);
      });
    }

    function flashHint() {
      const hint = document.getElementById('max-hint');
      if (hint) {
        hint.style.color = '#FF3B30';
        setTimeout(() => hint.style.color = '', 500);
      }
    }

    // ============================================
    // Sliders
    // ============================================
    function renderSliders(q) {
      const container = document.getElementById('slider-container');
      container.classList.remove('hidden');
      container.innerHTML = '';

      q.fields.forEach(f => {
        const value = formData[f.field] || q.default || 3;
        formData[f.field] = value;

        const div = document.createElement('div');
        div.innerHTML = `
          <div class="flex justify-between items-baseline mb-3">
            <div>
              <span class="text-[15px] font-medium text-[#1D1D1F]">${f.zh}</span>
              <span class="text-[13px] text-[#86868B] ml-2">${f.en}</span>
            </div>
            <span class="text-[22px] font-bold text-[#0071E3] slider-value">${value}</span>
          </div>
          <input type="range" min="${q.min}" max="${q.max}" value="${value}" class="w-full" data-field="${f.field}">
        `;

        const slider = div.querySelector('input[type="range"]');
        const valueDisplay = div.querySelector('.slider-value');

        slider.addEventListener('input', () => {
          const val = parseInt(slider.value);
          formData[f.field] = val;
          valueDisplay.textContent = val;
          updateNavigation();
        });

        container.appendChild(div);
      });
    }

    // ============================================
    // Textarea
    // ============================================
    function renderTextarea(q) {
      const container = document.getElementById('textarea-container');
      container.classList.remove('hidden');

      const textarea = document.getElementById('textarea-input');
      textarea.value = formData[q.field] || '';
      textarea.placeholder = `${q.placeholder.zh} / ${q.placeholder.en}`;
      textarea.oninput = () => {
        formData[q.field] = textarea.value;
        updateNavigation();
      };
    }

    // ============================================
    // Contact
    // ============================================
    function renderContact(q) {
      const container = document.getElementById('contact-container');
      container.classList.remove('hidden');

      const optionsContainer = document.getElementById('contact-options');
      optionsContainer.innerHTML = '';

      q.options.forEach(opt => {
        const isSelected = formData[q.field] === opt.value;
        const div = document.createElement('div');
        div.innerHTML = `
          <div class="option-item ${isSelected ? 'selected' : ''}" data-value="${opt.value}">
            <div class="flex items-center gap-3.5">
              <div class="option-radio flex items-center justify-center">
                ${isSelected ? '<div class="w-2.5 h-2.5 rounded-full bg-white"></div>' : ''}
              </div>
              <span class="text-[15px] font-medium text-[#1D1D1F]">${opt.zh}</span>
            </div>
          </div>
        `;

        const optionEl = div.querySelector('.option-item');
        optionEl.addEventListener('click', () => {
          formData[q.field] = opt.value;

          optionsContainer.querySelectorAll('.option-item').forEach(item => {
            item.classList.remove('selected');
            item.querySelector('.option-radio').innerHTML = '';
          });

          optionEl.classList.add('selected');
          optionEl.querySelector('.option-radio').innerHTML = '<div class="w-2.5 h-2.5 rounded-full bg-white"></div>';

          document.getElementById('contact-fields').classList.toggle('show', opt.value === '愿意');
          updateNavigation();
        });

        optionsContainer.appendChild(div);
      });

      // Contact fields
      ['wechat', 'phone', 'email'].forEach(type => {
        const input = document.getElementById(`contact-${type}`);
        input.value = formData[`contact_${type}`] || '';
        input.oninput = () => { formData[`contact_${type}`] = input.value; };
      });
    }

    // ============================================
    // Navigation
    // ============================================
    function updateNavigation() {
      const q = visibleQuestions[currentStep];
      const nextBtn = document.getElementById('next-btn');
      const prevBtn = document.getElementById('prev-btn');

      let canProceed = false;
      switch (q.type) {
        case 'single':
          canProceed = formData[q.field] !== undefined;
          if (canProceed && formData[q.field] === '其他') {
            canProceed = (formData[q.field + '_other'] || '').trim().length > 0;
          }
          break;
        case 'multi':
          canProceed = (formData[q.field] || []).length > 0;
          break;
        case 'slider':
          canProceed = q.fields.every(f => formData[f.field] !== undefined);
          break;
        case 'textarea':
          canProceed = (formData[q.field] || '').trim().length > 0;
          break;
        case 'contact':
          canProceed = formData[q.field] !== undefined;
          break;
      }

      const isLastQuestion = currentStep >= visibleQuestions.length - 1;

      // 设置按钮文本和点击事件
      if (isLastQuestion) {
        nextBtn.textContent = '提交问卷';
        nextBtn.onclick = function() {
          submitSurvey();
        };
        // 如果从浅度继续，按钮始终可用
        if (continueFromShallow) {
          nextBtn.disabled = false;
        } else {
          nextBtn.disabled = !canProceed;
        }
      } else {
        nextBtn.textContent = '继续';
        nextBtn.onclick = function() {
          goNext();
        };
        nextBtn.disabled = !canProceed;
      }

      nextBtn.className = 'apple-btn apple-btn-primary px-8 py-3';
      prevBtn.classList.toggle('hidden', currentStep === 0);
      document.getElementById('prev-spacer').classList.toggle('hidden', currentStep > 0);
    }

    function goNext() {
      collectInputs();

      // 如果是最后一题，不提交，只显示提交按钮
      if (currentStep >= visibleQuestions.length - 1) {
        return;
      }

      animateOut('next');
      setTimeout(() => {
        currentStep++;
        updateVisibleQuestions();
        showQuestion();
      }, 300);
    }

    function goBack() {
      if (currentStep <= 0) return;
      collectInputs();
      animateOut('prev');
      setTimeout(() => {
        currentStep--;
        showQuestion();
      }, 300);
    }

    function animateOut(direction) {
      const el = document.getElementById('question-area');
      el.style.opacity = '0';
      el.style.transform = direction === 'next' ? 'translateX(-20px)' : 'translateX(20px)';
    }

    function collectInputs() {
      document.querySelectorAll('.other-text-input').forEach(input => {
        if (input.value.trim()) {
          formData[input.dataset.field] = input.value.trim();
        }
      });
    }

    // ============================================
    // Submit
    // ============================================
    async function submitSurvey() {
      if (isSubmitting) return;
      isSubmitting = true;

      collectInputs();
      formData.completed_at = new Date().toISOString();

      // 如果是浅度调研，先存储数据，不立即提交
      if (surveyType === 'shallow') {
        pendingShallowData = { ...formData };
        isSubmitting = false;
        showThankYou();
        return;
      }

      // 深度调研或独立深度调研，直接提交
      try {
        if (!navigator.onLine) throw new Error('网络已断开');

        const result = await submitWithRetry(formData);
        if (result.success) {
          pendingShallowData = null; // 清除待提交数据
          showThankYou();
        } else {
          throw new Error(result.error || '提交失败');
        }
      } catch (err) {
        showError(err.message);
      } finally {
        isSubmitting = false;
      }
    }

    async function submitWithRetry(data, maxRetries = 2) {
      for (let i = 0; i <= maxRetries; i++) {
        try {
          return await window.CrossPilotData.submitResponse(data);
        } catch (err) {
          if (i === maxRetries) throw err;
          await new Promise(r => setTimeout(r, 1000));
        }
      }
    }

    function showThankYou() {
      document.getElementById('btn-continue-deep').classList.toggle('hidden', surveyType !== 'shallow');
      switchView('view-thanks');
    }

    // 继续深度调研
    function continueToDeep() {
      startSurvey('deep', true);
    }

    // 返回首页（如果有待提交的浅度数据，先提交）
    async function goHome() {
      if (pendingShallowData) {
        try {
          if (!navigator.onLine) throw new Error('网络已断开');
          await submitWithRetry(pendingShallowData);
          pendingShallowData = null;
        } catch (err) {
          showError('提交失败: ' + err.message);
          return;
        }
      }
      switchView('view-home');
    }

    function showError(message) {
      const toast = document.getElementById('error-toast');
      toast.textContent = message;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 3000);
    }
  </script>
</body>
