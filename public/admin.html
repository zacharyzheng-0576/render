<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>调研数据统计 — CrossPilot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            'apple': ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', 'Arial', 'sans-serif']
          }
        }
      }
    }
  </script>
  <script src="assets/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="data-service.js"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background: #000000;
      color: #F5F5F7;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      position: relative;
    }

    /* 底部 indigo 渐变 */
    body::after {
      content: '';
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 50vh;
      background: linear-gradient(
        to top,
        rgba(79, 70, 229, 0.2) 0%,
        rgba(99, 102, 241, 0.1) 25%,
        rgba(99, 102, 241, 0.05) 50%,
        transparent 100%
      );
      pointer-events: none;
      z-index: 0;
    }

    .admin-container {
      position: relative;
      z-index: 1;
    }

    /* Liquid Glass Card */
    .apple-card {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.08) 0%,
        rgba(255, 255, 255, 0.04) 50%,
        rgba(255, 255, 255, 0.06) 100%
      );
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border-radius: 20px;
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.1),
        inset 0 -1px 0 rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.12);
      position: relative;
      overflow: hidden;
    }

    .apple-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      z-index: 1;
    }

    /* Glass Button */
    .apple-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
      border-radius: 100px;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
      cursor: pointer;
      border: none;
      outline: none;
      position: relative;
      overflow: hidden;
    }

    .apple-btn-primary {
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.9) 0%, rgba(59, 130, 246, 0.95) 100%);
      color: #FFFFFF;
      box-shadow:
        0 4px 16px rgba(37, 99, 235, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
    }
    .apple-btn-primary::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.2), transparent);
      border-radius: 100px 100px 0 0;
      pointer-events: none;
    }
    .apple-btn-primary:hover {
      background: linear-gradient(135deg, rgba(29, 78, 216, 0.95) 0%, rgba(37, 99, 235, 1) 100%);
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.45);
      transform: translateY(-1px);
    }

    .apple-btn-secondary {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%);
      color: #FFFFFF;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
    }
    .apple-btn-secondary::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.1), transparent);
      border-radius: 100px 100px 0 0;
      pointer-events: none;
    }
    .apple-btn-secondary:hover {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.08) 100%);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .apple-btn-danger {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.08) 0%,
        rgba(239, 68, 68, 0.15) 100%
      );
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.25);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(20px);
    }
    .apple-btn-danger::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.08), transparent);
      border-radius: 100px 100px 0 0;
      pointer-events: none;
    }
    .apple-btn-danger:hover {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.12) 0%,
        rgba(239, 68, 68, 0.2) 100%
      );
      border-color: rgba(239, 68, 68, 0.35);
      box-shadow: 0 4px 16px rgba(239, 68, 68, 0.15);
    }

    .apple-btn-success {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.08) 0%,
        rgba(34, 197, 94, 0.15) 100%
      );
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.25);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(20px);
    }
    .apple-btn-success::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.08), transparent);
      border-radius: 100px 100px 0 0;
      pointer-events: none;
    }
    .apple-btn-success:hover {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.12) 0%,
        rgba(34, 197, 94, 0.2) 100%
      );
      border-color: rgba(34, 197, 94, 0.35);
      box-shadow: 0 4px 16px rgba(34, 197, 94, 0.15);
    }

    .apple-btn-purple {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.08) 0%,
        rgba(129, 140, 248, 0.15) 100%
      );
      color: #a5b4fc;
      border: 1px solid rgba(129, 140, 248, 0.25);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(20px);
    }
    .apple-btn-purple::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.08), transparent);
      border-radius: 100px 100px 0 0;
      pointer-events: none;
    }
    .apple-btn-purple:hover {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.12) 0%,
        rgba(129, 140, 248, 0.2) 100%
      );
      border-color: rgba(129, 140, 248, 0.35);
      box-shadow: 0 4px 16px rgba(129, 140, 248, 0.15);
    }

    /* Glass Input */
    .apple-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.06) 0%,
        rgba(255, 255, 255, 0.03) 100%
      );
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: #F5F5F7;
    }
    .apple-input:focus {
      border-color: rgba(59, 130, 246, 0.5);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.15);
    }
    .apple-input::placeholder {
      color: rgba(255, 255, 255, 0.35);
    }

    .apple-select {
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.06) 0%,
        rgba(255, 255, 255, 0.03) 100%
      );
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: #F5F5F7;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .apple-select:focus {
      border-color: rgba(59, 130, 246, 0.5);
    }
    .apple-select option {
      background: #1C1C1E;
      color: #F5F5F7;
    }

    /* Table styles */
    .data-table {
      width: 100%;
      border-collapse: collapse;
    }
    .data-table th {
      padding: 12px 16px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .data-table td {
      padding: 14px 16px;
      font-size: 14px;
      color: #F5F5F7;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .data-table tr:hover td {
      background: rgba(255, 255, 255, 0.03);
    }

    /* Badge styles */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
      backdrop-filter: blur(10px);
    }
    .badge-blue {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.2);
    }
    .badge-purple {
      background: rgba(129, 140, 248, 0.15);
      color: #818cf8;
      border: 1px solid rgba(129, 140, 248, 0.2);
    }

    /* Delete button */
    .btn-delete {
      padding: 6px 14px;
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      background: rgba(239, 68, 68, 0.1);
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(10px);
    }
    .btn-delete:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.5);
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.2);
    }

    /* Chart card - Liquid Glass Style */
    .chart-card {
      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.06) 0%,
        rgba(255, 255, 255, 0.02) 50%,
        rgba(255, 255, 255, 0.04) 100%
      );
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border-radius: 24px;
      padding: 24px;
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        inset 0 -1px 0 rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .chart-card:hover {
      transform: translateY(-2px);
      box-shadow:
        0 12px 40px rgba(59, 130, 246, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        inset 0 -1px 0 rgba(0, 0, 0, 0.2);
      border-color: rgba(59, 130, 246, 0.2);
    }

    .chart-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
      z-index: 1;
    }

    .chart-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.03), transparent);
      pointer-events: none;
    }

    .chart-card h3 {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      position: relative;
      z-index: 2;
    }

    .chart-card canvas {
      position: relative;
      z-index: 2;
    }

    /* Auth panel */
    .auth-card {
      max-width: 400px;
      margin: 0 auto;
      padding: 40px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* Table wrapper */
    .table-wrapper {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">

  <!-- Auth Panel -->
  <div id="auth-panel" class="hidden">
    <div class="apple-card auth-card">
      <h2 class="text-2xl font-bold text-white mb-2">后台登录</h2>
      <p class="text-[15px] text-gray-400 mb-8">请输入管理员账号和密码</p>
      <div class="space-y-4">
        <input type="email" id="admin-email" class="apple-input" placeholder="邮箱">
        <input type="password" id="admin-password" class="apple-input" placeholder="密码">
        <button id="btn-login" class="apple-btn apple-btn-primary w-full py-3" onclick="handleLogin()">登录</button>
        <p id="auth-error" class="text-[13px] text-red-400 hidden"></p>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div id="main-content" class="hidden max-w-7xl mx-auto">
    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
      <div>
        <h1 class="text-[28px] font-bold text-white tracking-tight">跨境电商行业调研统计</h1>
        <p class="text-[15px] text-gray-400 mt-1">共 <span id="total-count" class="font-semibold text-blue-400">0</span> 份问卷</p>
      </div>
      <div class="flex flex-wrap gap-2">
        <button onclick="exportCSV()" class="apple-btn apple-btn-secondary text-[13px]">导出 CSV</button>
        <button onclick="exportExcel()" class="apple-btn apple-btn-success text-[13px]">导出 Excel</button>
        <button onclick="exportPDF()" class="apple-btn apple-btn-purple text-[13px]">导出 PDF</button>
        <button onclick="clearAll()" class="apple-btn apple-btn-danger text-[13px]">清空全部</button>
      </div>
    </div>

    <!-- Filters -->
    <div class="apple-card p-5 mb-6">
      <div class="flex flex-wrap gap-3">
        <select id="filter-survey-type" class="apple-select" onchange="renderAll()">
          <option value="">全部问卷类型</option>
          <option value="shallow">快速调研</option>
          <option value="deep">深度调研</option>
        </select>
        <select id="filter-type" class="apple-select" onchange="renderAll()">
          <option value="">全部业务类型</option>
          <option value="独立站卖家">独立站卖家</option>
          <option value="平台卖家">平台卖家</option>
          <option value="两者都做">两者都做</option>
        </select>
        <select id="filter-market" class="apple-select" onchange="renderAll()">
          <option value="">全部目标市场</option>
          <option value="北美">北美</option>
          <option value="欧洲">欧洲</option>
          <option value="东南亚">东南亚</option>
          <option value="日韩">日韩</option>
          <option value="中东">中东</option>
          <option value="拉美">拉美</option>
          <option value="全球">全球</option>
        </select>
        <select id="filter-ad-spend" class="apple-select" onchange="renderAll()">
          <option value="">全部广告投入</option>
          <option value="0">目前不投广告</option>
          <option value="5千以下">¥5,000 以下</option>
          <option value="5千-2万">¥5,000 ~ ¥20,000</option>
          <option value="2万-10万">¥20,000 ~ ¥100,000</option>
          <option value="10万以上">¥100,000+</option>
        </select>
      </div>
    </div>

    <!-- Charts Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 mb-8">
      <div class="chart-card">
        <h3>业务类型分布</h3>
        <canvas id="typeChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>目标市场分布</h3>
        <canvas id="marketChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>月广告投入分布</h3>
        <canvas id="adSpendChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>素材更新频率</h3>
        <canvas id="creativeFreqChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>最大创意挑战</h3>
        <canvas id="creativeChallengeChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>竞品追踪方式</h3>
        <canvas id="competitorChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>转化率满意度</h3>
        <canvas id="conversionChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>商品页问题</h3>
        <canvas id="pageIssuesChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>AI 使用经验</h3>
        <canvas id="aiExpChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>AI 期望功能</h3>
        <canvas id="aiExpectationChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>付费意愿</h3>
        <canvas id="payChart"></canvas>
      </div>

      <!-- Deep survey charts -->
      <div class="chart-card deep-chart hidden">
        <h3>广告平台分布</h3>
        <canvas id="adPlatformChart"></canvas>
      </div>
      <div class="chart-card deep-chart hidden">
        <h3>月素材数量</h3>
        <canvas id="creativeCountChart"></canvas>
      </div>
      <div class="chart-card deep-chart hidden">
        <h3>创意来源</h3>
        <canvas id="creativeSourceChart"></canvas>
      </div>
      <div class="chart-card deep-chart hidden">
        <h3>创意痛点详情</h3>
        <canvas id="creativePainDetailChart"></canvas>
      </div>
      <div class="chart-card deep-chart hidden">
        <h3>页面优化耗时</h3>
        <canvas id="pageTimeChart"></canvas>
      </div>
      <div class="chart-card deep-chart hidden">
        <h3>页面重要元素</h3>
        <canvas id="pageElementsChart"></canvas>
      </div>
      <div class="chart-card deep-chart hidden">
        <h3>市场准备度检查</h3>
        <canvas id="marketCheckChart"></canvas>
      </div>
      <div class="chart-card deep-chart hidden">
        <h3>竞品分析频率</h3>
        <canvas id="competitorFreqChart"></canvas>
      </div>
      <div class="chart-card deep-chart hidden">
        <h3>竞品分析内容</h3>
        <canvas id="competitorContentChart"></canvas>
      </div>
      <div class="chart-card deep-chart hidden">
        <h3>创意追踪付费意愿</h3>
        <canvas id="payCreativeScoutChart"></canvas>
      </div>
      <div class="chart-card deep-chart hidden">
        <h3>页面优化付费意愿</h3>
        <canvas id="payPageOptimizeChart"></canvas>
      </div>
      <div class="chart-card deep-chart hidden">
        <h3>最有价值功能</h3>
        <canvas id="valuableFeaturesChart"></canvas>
      </div>
    </div>

    <!-- Data Table -->
    <div class="apple-card overflow-hidden mb-8">
      <div class="p-5 border-b border-white/10">
        <h3 class="text-[17px] font-semibold text-white">最新提交记录</h3>
      </div>
      <div class="overflow-x-auto" style="max-height: 500px;">
        <table class="data-table">
          <thead>
            <tr>
              <th>时间</th>
              <th>类型</th>
              <th>业务类型</th>
              <th>目标市场</th>
              <th>月广告投入</th>
              <th>AI经验</th>
              <th>联系方式</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="response-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let allResponses = [];
    let charts = {};

    // Liquid Glass color palette - vivid and bright
    const COLORS = [
      'rgba(96, 165, 250, 0.9)',    // Blue
      'rgba(129, 140, 248, 0.9)',   // Indigo
      'rgba(74, 222, 128, 0.9)',    // Green
      'rgba(253, 186, 116, 0.9)',   // Orange
      'rgba(252, 165, 165, 0.9)',   // Red
      'rgba(192, 132, 252, 0.9)',   // Purple
      'rgba(244, 114, 182, 0.9)',   // Pink
      'rgba(103, 232, 249, 0.9)',   // Light Blue
      'rgba(253, 224, 71, 0.9)',    // Yellow
      'rgba(94, 234, 212, 0.9)'     // Teal
    ];

    // Gradient colors - bright and clear on dark background
    const GRADIENT_COLORS = [

    };

    function filterData() {
      const surveyType = document.getElementById('filter-survey-type').value;
      const type = document.getElementById('filter-type').value;
      const market = document.getElementById('filter-market').value;
      const adSpend = document.getElementById('filter-ad-spend').value;

      return allResponses.filter(r => {
        if (surveyType && r.survey_type !== surveyType) return false;
        if (type && r.business_type !== type) return false;
        if (market && r.main_market !== market) return false;
        if (adSpend && r.monthly_ad_spend !== adSpend) return false;
        return true;
      });
    }

    function countField(data, field) {
      const opts = ALL_OPTIONS[field] || [];
      const counts = {};
      opts.forEach(o => counts[o] = 0);
      data.forEach(r => {
        const val = r[field];
        if (val && counts.hasOwnProperty(val)) counts[val]++;
      });
      return { labels: opts, values: opts.map(o => counts[o]) };
    }

    function countMultiField(data, field) {
      const opts = ALL_OPTIONS[field] || [];
      const counts = {};
      opts.forEach(o => counts[o] = 0);
      data.forEach(r => {
        const arr = r[field];
        if (Array.isArray(arr)) {
          arr.forEach(v => { if (counts.hasOwnProperty(v)) counts[v]++; });
        }
      });
      return { labels: opts, values: opts.map(o => counts[o]) };
    }

    function avgField(data, field) {
      const vals = data.map(r => r[field]).filter(v => typeof v === 'number');
      return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
    }

    function formatTime(isoString) {
      if (!isoString) return '';
      return new Date(isoString).toLocaleString('zh-CN', {
        timeZone: 'Asia/Shanghai',
        month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit',
        hour12: false
      }).replace(/\//g, '-');
    }

    function createGradient(ctx, colorIndex) {
      const gradient = ctx.createLinearGradient(0, 0, 0, 400);
      gradient.addColorStop(0, GRADIENT_COLORS[colorIndex % GRADIENT_COLORS.length].start);
      gradient.addColorStop(1, GRADIENT_COLORS[colorIndex % GRADIENT_COLORS.length].end);
      return gradient;
    }

    function renderBarChart(canvasId, result) {
      const ctx = document.getElementById(canvasId)?.getContext('2d');
      if (!ctx) return;
      if (charts[canvasId]) charts[canvasId].destroy();

      // Create gradients for each bar - same as pie chart
      const backgroundColors = result.labels.map((_, i) => {
        const gradient = ctx.createLinearGradient(0, 0, 0, ctx.canvas.height);
        gradient.addColorStop(0, GRADIENT_COLORS[i % GRADIENT_COLORS.length].start);
        gradient.addColorStop(1, GRADIENT_COLORS[i % GRADIENT_COLORS.length].end);
        return gradient;
      });

      charts[canvasId] = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: result.labels,
          datasets: [{
            data: result.values,
            backgroundColor: backgroundColors,
            borderRadius: 12,
            maxBarThickness: 40,
            borderWidth: 0,
            borderSkipped: false,
            hoverBorderWidth: 2,
            hoverBorderColor: 'rgba(255, 255, 255, 0.4)'
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: 'rgba(15, 23, 42, 0.95)',
              titleColor: 'rgba(255, 255, 255, 0.95)',
              bodyColor: 'rgba(255, 255, 255, 0.8)',
              borderColor: 'rgba(255, 255, 255, 0.15)',
              borderWidth: 1,
              cornerRadius: 12,
              padding: 14,
              displayColors: true,
              boxPadding: 6
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: {
                stepSize: 1,
                font: { size: 11 },
                color: 'rgba(255, 255, 255, 0.4)',
                padding: 8
              },
              grid: {
                color: 'rgba(255, 255, 255, 0.06)',
                drawBorder: false
              },
              border: { display: false }
            },
            x: {
              ticks: {
                font: { size: 10 },
                maxRotation: 45,
                color: 'rgba(255, 255, 255, 0.4)',
                padding: 8
              },
              grid: {
                display: false
              },
              border: { display: false }
            }
          }
        }
      });
    }

    function createPieGradient(ctx, centerX, centerY, radius, colorIndex) {
      const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
      gradient.addColorStop(0, GRADIENT_COLORS[colorIndex % GRADIENT_COLORS.length].start);
      gradient.addColorStop(1, GRADIENT_COLORS[colorIndex % GRADIENT_COLORS.length].end);
      return gradient;
    }

    function renderPieChart(canvasId, data, labels) {
      const ctx = document.getElementById(canvasId)?.getContext('2d');
      if (!ctx) return;
      if (charts[canvasId]) charts[canvasId].destroy();

      // Create gradients for each slice
      const backgroundColors = labels.map((_, i) => {
        const centerX = ctx.canvas.width / 2;
        const centerY = ctx.canvas.height / 2;
        const radius = Math.min(centerX, centerY) * 0.8;
        return createPieGradient(ctx, centerX, centerY, radius, i);
      });

      charts[canvasId] = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels,
          datasets: [{
            data,
            backgroundColor: backgroundColors,
            borderWidth: 0,
            borderColor: 'transparent',
            hoverBorderWidth: 2,
            hoverBorderColor: 'rgba(255, 255, 255, 0.4)',
            hoverOffset: 8
          }]
        },
        options: {
          responsive: true,
          cutout: '68%',
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                font: { size: 11 },
                padding: 16,
                color: 'rgba(255, 255, 255, 0.6)',
                usePointStyle: true,
                pointStyle: 'circle'
              }
            },
            tooltip: {
              backgroundColor: 'rgba(15, 23, 42, 0.95)',
              titleColor: 'rgba(255, 255, 255, 0.95)',
              bodyColor: 'rgba(255, 255, 255, 0.8)',
              borderColor: 'rgba(255, 255, 255, 0.15)',
              borderWidth: 1,
              cornerRadius: 12,
              padding: 14,
              displayColors: true,
              boxPadding: 6
            }
          }
        }
      });
    }

    function renderRadarChart(data) {
      const ctx = document.getElementById('radarChart')?.getContext('2d');
      if (!ctx) return;
      if (charts['radarChart']) charts['radarChart'].destroy();

      const groups = {};
      data.forEach(r => {
        const t = r.business_type || '未知';
        if (!groups[t]) groups[t] = [];
        groups[t].push(r);
      });

      const labels = ['创意素材', '竞品情报', '多语言管理', '广告优化', '运营效率'];
      const fields = ['pain_creative', 'pain_intelligence', 'pain_multilingual', 'pain_ad_optimize', 'pain_efficiency'];

      // Radar chart uses its own color scheme
      const RADAR_COLORS = [
        'rgba(59, 130, 246, 0.85)',
        'rgba(99, 102, 241, 0.85)',
        'rgba(34, 197, 94, 0.85)',
        'rgba(251, 146, 60, 0.85)',
        'rgba(248, 113, 113, 0.85)',
        'rgba(168, 85, 247, 0.85)',
        'rgba(236, 72, 153, 0.85)',
        'rgba(56, 189, 248, 0.85)',
        'rgba(250, 204, 21, 0.85)',
        'rgba(45, 212, 191, 0.85)'
      ];

      charts['radarChart'] = new Chart(ctx, {
        type: 'radar',
        data: {
          labels,
          datasets: Object.entries(groups).map(([type, rows], i) => ({
            label: type,
            data: fields.map(f => Math.round(avgField(rows, f) * 10) / 10),
            borderColor: RADAR_COLORS[i],
            backgroundColor: RADAR_COLORS[i].replace('0.85', '0.15'),
            borderWidth: 2,
            pointBackgroundColor: RADAR_COLORS[i],
            pointBorderColor: 'rgba(255, 255, 255, 0.3)',
            pointBorderWidth: 1,
            pointRadius: 4,
            pointHoverRadius: 6
          }))
        },
        options: {
          responsive: true,
          scales: {
            r: {
              min: 0,
              max: 5,
              ticks: {
                stepSize: 1,
                color: 'rgba(255, 255, 255, 0.4)',
                backdropColor: 'transparent',
                font: { size: 10 }
              },
              grid: {
                color: 'rgba(255, 255, 255, 0.08)',
                circular: true
              },
              angleLines: {
                color: 'rgba(255, 255, 255, 0.08)'
              },
              pointLabels: {
                color: 'rgba(255, 255, 255, 0.6)',
                font: { size: 11, weight: '500' }
              }
            }
          },
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                font: { size: 11 },
                color: 'rgba(255, 255, 255, 0.6)',

                pointStyle: 'circle',

              }

              backgroundColor: 'rgba(15, 23, 42, 0.9)',
              titleColor: 'rgba(255, 255, 255, 0.9)',
              bodyColor: 'rgba(255, 255, 255, 0.7)',
              borderColor: 'rgba(255, 255, 255, 0.1)',
              borderWidth: 1,
              cornerRadius: 12,
              padding: 12
            }
          }
        }
      });
    }

    function renderTable(data) {
      const tbody = document.getElementById('response-body');
      tbody.innerHTML = data.map(r => {
        const contact = r.contact_wechat || r.contact_phone || r.contact_email || '-';
        const typeBadge = r.survey_type === 'deep'
          ? '<span class="badge badge-purple">深度</span>'
          : '<span class="badge badge-blue">快速</span>';

        return `
          <tr>
            <td>${formatTime(r.created_at)}</td>
            <td>${typeBadge}</td>
            <td>${r.business_type || '-'}</td>
            <td>${r.main_market || '-'}</td>
            <td>${r.monthly_ad_spend || '-'}</td>
            <td>${r.ai_experience || '-'}</td>
            <td>${contact}</td>
            <td><button class="btn-delete" onclick="deleteOne('${r.id}')">删除</button></td>
          </tr>
        `;
      }).join('');
    }

    function renderAll() {
      const data = filterData();
      document.getElementById('total-count').textContent = data.length;

      // Show/hide deep charts
      const hasDeep = data.some(r => r.survey_type === 'deep');
      document.querySelectorAll('.deep-chart').forEach(el => {
        el.classList.toggle('hidden', !hasDeep);
      });

      // Basic charts (shallow)
      renderPieChart('typeChart', countField(data, 'business_type').values, ALL_OPTIONS.business_type);
      renderPieChart('marketChart', countField(data, 'main_market').values, ALL_OPTIONS.main_market);
      renderBarChart('adSpendChart', countField(data, 'monthly_ad_spend'));
      renderBarChart('creativeFreqChart', countField(data, 'creative_refresh_frequency'));
      renderBarChart('creativeChallengeChart', countField(data, 'biggest_creative_challenge'));
      renderPieChart('competitorChart', countField(data, 'competitor_tracking').values, ALL_OPTIONS.competitor_tracking);
      renderPieChart('conversionChart', countField(data, 'conversion_rate_concern').values, ALL_OPTIONS.conversion_rate_concern);
      renderBarChart('pageIssuesChart', countMultiField(data, 'product_page_issues'));
      renderPieChart('aiExpChart', countField(data, 'ai_experience').values, ALL_OPTIONS.ai_experience);
      renderBarChart('aiExpectationChart', countField(data, 'ai_expectation'));
      renderBarChart('payChart', countField(data, 'willing_to_pay'));

      // Deep survey charts
      if (hasDeep) {
        renderBarChart('adPlatformChart', countMultiField(data, 'ad_platforms'));
        renderBarChart('creativeCountChart', countField(data, 'monthly_creative_count'));
        renderBarChart('creativeSourceChart', countField(data, 'creative_source'));
        renderBarChart('creativePainDetailChart', countField(data, 'creative_pain_detail'));
        renderBarChart('pageTimeChart', countField(data, 'product_page_time'));
        renderBarChart('pageElementsChart', countMultiField(data, 'product_page_elements'));

        renderBarChart('competitorContentChart', countMultiField(data, 'competitor_analysis_content'));

        renderBarChart('payPageOptimizeChart', countField(data, 'pay_for_page_optimize'));
        renderBarChart('valuableFeaturesChart', countMultiField(data, 'most_valuable_features'));

      renderTable(data);

        const counts = {};
        options.forEach(o => counts[o] = 0);
        data.forEach(r => {
          const val = r[field];
          if (val && counts.hasOwnProperty(val)) counts[val]++;
        });

      doc.text('Cross-border Seller Survey Report', 105, 52, { align: 'center' });

      doc.setFontSize(10);
      doc.setTextColor(156, 163, 175);

      doc.setFontSize(14);

      // Statistics section
      doc.setFontSize(14);
      doc.setTextColor(29, 29, 31);
      doc.text('Key Statistics', 15, 140);

      // Business Type
      const businessTypeCounts = getFieldCounts('business_type', ALL_OPTIONS.business_type);

      doc.text('Business Type:', 15, yPos);

      // Main Market
      yPos += 10;
      const marketCounts = getFieldCounts('main_market', ALL_OPTIONS.main_market);
      doc.text('Target Market:', 15, yPos);
      marketCounts.forEach(item => {
        doc.text(`  ${item.label}: ${item.count}`, 20, yPos + 8);
        yPos += 8;
      });

      // Page 2: More Statistics
      doc.addPage();
      yPos = 20;

      doc.setFontSize(14);
      doc.setTextColor(29, 29, 31);
      doc.text('Ad Creative Statistics', 15, yPos);
      yPos += 12;

      // Creative Refresh Frequency
      const refreshCounts = getFieldCounts('creative_refresh_frequency', ALL_OPTIONS.creative_refresh_frequency);
      doc.setFontSize(11);
      doc.setTextColor(75, 85, 99);
      doc.text('Creative Refresh Frequency:', 15, yPos);
      refreshCounts.forEach(item => {
        doc.text(`  ${item.label}: ${item.count}`, 20, yPos + 8);
        yPos += 8;
      });

      // Biggest Creative Challenge
      yPos += 10;
      const challengeCounts = getFieldCounts('biggest_creative_challenge', ALL_OPTIONS.biggest_creative_challenge);
      doc.text('Biggest Creative Challenge:', 15, yPos);
      challengeCounts.forEach(item => {
        doc.text(`  ${item.label}: ${item.count}`, 20, yPos + 8);
        yPos += 8;
      });

      // Competitor Tracking
      yPos += 10;
      const competitorCounts = getFieldCounts('competitor_tracking', ALL_OPTIONS.competitor_tracking);
      doc.text('Competitor Tracking:', 15, yPos);
      competitorCounts.forEach(item => {
        doc.text(`  ${item.label}: ${item.count}`, 20, yPos + 8);
        yPos += 8;
      });

      // Conversion Rate Concern
      yPos += 10;
      const conversionCounts = getFieldCounts('conversion_rate_concern', ALL_OPTIONS.conversion_rate_concern);
      doc.text('Conversion Rate Satisfaction:', 15, yPos);
      conversionCounts.forEach(item => {
        doc.text(`  ${item.label}: ${item.count}`, 20, yPos + 8);
        yPos += 8;
      });

      // AI Experience
      yPos += 10;
      const aiExpCounts = getFieldCounts('ai_experience', ALL_OPTIONS.ai_experience);
      doc.text('AI Experience:', 15, yPos);
      aiExpCounts.forEach(item => {
        doc.text(`  ${item.label}: ${item.count}`, 20, yPos + 8);
        yPos += 8;
      });

      // Willingness to Pay
      yPos += 10;
      const payCounts = getFieldCounts('willing_to_pay', ALL_OPTIONS.willing_to_pay);
      doc.text('Willingness to Pay:', 15, yPos);
      payCounts.forEach(item => {
        doc.text(`  ${item.label}: ${item.count}`, 20, yPos + 8);
        yPos += 8;
      });

      // Page 3: Data Table
      doc.addPage();

      doc.setFontSize(14);
      doc.setTextColor(29, 29, 31);
      doc.text('Response Data', 15, 20);

      doc.setFontSize(10);
      doc.setTextColor(107, 114, 128);
      doc.text(`Total: ${data.length} responses`, 15, 28);

      const tableData = data.slice(0, 50).map(r => {
        const time = r.created_at ? new Date(r.created_at).toLocaleDateString('en-US', {
          month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit'
        }) : '';
        return [
          time,
          r.survey_type === 'deep' ? 'Deep' : 'Quick',
          r.business_type || '-',
          r.main_market || '-',
          r.monthly_ad_spend || '-',
          r.ai_experience || '-',
          r.willing_to_pay || '-'
        ];
      });

      doc.autoTable({
        head: [['Time', 'Type', 'Business', 'Market', 'Ad Spend', 'AI Exp', 'Pay Willing']],
        body: tableData,
        startY: 35,
        styles: {
          fontSize: 8,
          cellPadding: 4,
          lineColor: [229, 231, 235],
          lineWidth: 0.1,
          font: 'helvetica'
        },
        headStyles: {
          fillColor: [124, 58, 237],
          textColor: 255,
          fontStyle: 'bold',
          fontSize: 9
        },
        alternateRowStyles: {
          fillColor: [249, 250, 251]
        },
        columnStyles: {
          0: { cellWidth: 30 },
          1: { cellWidth: 15 },
          2: { cellWidth: 25 },
          3: { cellWidth: 25 },
          4: { cellWidth: 25 },
          5: { cellWidth: 25 },
          6: { cellWidth: 25 }
        }
      });

      doc.save('crosspilot_survey_report.pdf');
    }

    function download(content, filename, type) {
      const url = URL.createObjectURL(new Blob([content], { type }));
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    // CRUD
    function deleteOne(id) {
      if (!confirm('确定删除这条数据？')) return;
      window.CrossPilotData.deleteResponse(id).then(loadData).catch(err => alert('删除失败'));
    }

    function clearAll() {
      if (!confirm('确定清空所有数据？此操作不可撤销！')) return;
      if (!confirm('再次确认：删除全部数据？')) return;
      window.CrossPilotData.clearResponses(allResponses).then(loadData).catch(err => alert('清空失败'));
    }

    function loadData() {
      window.CrossPilotData.loadResponses().then(data => {
        allResponses = data.responses || [];
        renderAll();
      }).catch(err => {
        document.getElementById('total-count').textContent = '加载失败';
      });
    }

    // Auth
    function handleLogin() {
      const email = document.getElementById('admin-email').value.trim();
      const password = document.getElementById('admin-password').value;
      const errorEl = document.getElementById('auth-error');

      if (!email || !password) {
        errorEl.textContent = '请输入邮箱和密码';
        errorEl.classList.remove('hidden');
        return;
      }

      errorEl.classList.add('hidden');
      const btn = document.getElementById('btn-login');
      btn.disabled = true;
      btn.textContent = '登录中...';

      window.CrossPilotData.login(email, password)
        .catch(err => {
          errorEl.textContent = err.message || '登录失败';
          errorEl.classList.remove('hidden');
        })
        .finally(() => {
          btn.disabled = false;
          btn.textContent = '登录';
        });
    }

    // Init
    window.CrossPilotData.onAuthChange(user => {
      if (!window.CrossPilotData.supabaseEnabled()) {
        document.getElementById('auth-panel').classList.add('hidden');
        document.getElementById('main-content').classList.remove('hidden');
        loadData();
        return;
      }

      if (window.CrossPilotData.isAllowedAdmin(user)) {
        document.getElementById('auth-panel').classList.add('hidden');
        document.getElementById('main-content').classList.remove('hidden');
        loadData();
      } else {
        document.getElementById('auth-panel').classList.remove('hidden');
        document.getElementById('main-content').classList.add('hidden');
      }
    });

    // Auto-refresh
    setInterval(loadData, 30000);
  </script>
</body>
</html>
