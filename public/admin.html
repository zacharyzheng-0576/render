<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>调研数据统计 — CrossPilot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            'apple': ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', 'Arial', 'sans-serif']
          }
        }
      }
    }
  </script>
  <script src="assets/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="data-service.js"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background: #000000;
      color: #F5F5F7;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      position: relative;
    }

    /* 底部 indigo 渐变 */
    body::after {
      content: '';
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 50vh;
      background: linear-gradient(
        to top,
        rgba(79, 70, 229, 0.2) 0%,
        rgba(99, 102, 241, 0.1) 25%,
        rgba(99, 102, 241, 0.05) 50%,
        transparent 100%
      );
      pointer-events: none;
      z-index: 0;
    }

    .admin-container {
      position: relative;
      z-index: 1;
    }

    /* Liquid Glass Card */
    .apple-card {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.08) 0%,
        rgba(255, 255, 255, 0.04) 50%,
        rgba(255, 255, 255, 0.06) 100%
      );
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border-radius: 20px;
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.1),
        inset 0 -1px 0 rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.12);
      position: relative;
      overflow: hidden;
    }

    .apple-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      z-index: 1;
    }

    /* Glass Button */
    .apple-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
      border-radius: 100px;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
      cursor: pointer;
      border: none;
      outline: none;
      position: relative;
      overflow: hidden;
    }

    .apple-btn-primary {
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.9) 0%, rgba(59, 130, 246, 0.95) 100%);
      color: #FFFFFF;
      box-shadow:
        0 4px 16px rgba(37, 99, 235, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
    }
    .apple-btn-primary::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.2), transparent);
      border-radius: 100px 100px 0 0;
      pointer-events: none;
    }
    .apple-btn-primary:hover {
      background: linear-gradient(135deg, rgba(29, 78, 216, 0.95) 0%, rgba(37, 99, 235, 1) 100%);
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.45);
      transform: translateY(-1px);
    }

    .apple-btn-secondary {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%);
      color: #FFFFFF;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
    }
    .apple-btn-secondary::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.1), transparent);
      border-radius: 100px 100px 0 0;
      pointer-events: none;
    }
    .apple-btn-secondary:hover {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.08) 100%);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .apple-btn-danger {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.08) 0%,
        rgba(239, 68, 68, 0.15) 100%
      );
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.25);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(20px);
    }
    .apple-btn-danger::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.08), transparent);
      border-radius: 100px 100px 0 0;
      pointer-events: none;
    }
    .apple-btn-danger:hover {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.12) 0%,
        rgba(239, 68, 68, 0.2) 100%
      );
      border-color: rgba(239, 68, 68, 0.35);
      box-shadow: 0 4px 16px rgba(239, 68, 68, 0.15);
    }

    .apple-btn-success {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.08) 0%,
        rgba(34, 197, 94, 0.15) 100%
      );
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.25);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(20px);
    }
    .apple-btn-success::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.08), transparent);
      border-radius: 100px 100px 0 0;
      pointer-events: none;
    }
    .apple-btn-success:hover {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.12) 0%,
        rgba(34, 197, 94, 0.2) 100%
      );
      border-color: rgba(34, 197, 94, 0.35);
      box-shadow: 0 4px 16px rgba(34, 197, 94, 0.15);
    }

    .apple-btn-purple {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.08) 0%,
        rgba(129, 140, 248, 0.15) 100%
      );
      color: #a5b4fc;
      border: 1px solid rgba(129, 140, 248, 0.25);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(20px);
    }
    .apple-btn-purple::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.08), transparent);
      border-radius: 100px 100px 0 0;
      pointer-events: none;
    }
    .apple-btn-purple:hover {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.12) 0%,
        rgba(129, 140, 248, 0.2) 100%
      );
      border-color: rgba(129, 140, 248, 0.35);
      box-shadow: 0 4px 16px rgba(129, 140, 248, 0.15);
    }

    /* Glass Input */
    .apple-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.06) 0%,
        rgba(255, 255, 255, 0.03) 100%
      );
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: #F5F5F7;
    }
    .apple-input:focus {
      border-color: rgba(59, 130, 246, 0.5);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.15);
    }
    .apple-input::placeholder {
      color: rgba(255, 255, 255, 0.35);
    }

    .apple-select {
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.06) 0%,
        rgba(255, 255, 255, 0.03) 100%
      );
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: #F5F5F7;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .apple-select:focus {
      border-color: rgba(59, 130, 246, 0.5);
    }
    .apple-select option {
      background: #1C1C1E;
      color: #F5F5F7;
    }

    /* Table styles */
    .data-table {
      width: 100%;
      border-collapse: collapse;
    }
    .data-table th {
      padding: 12px 16px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .data-table td {
      padding: 14px 16px;
      font-size: 14px;
      color: #F5F5F7;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .data-table tr:hover td {
      background: rgba(255, 255, 255, 0.03);
    }

    /* Badge styles */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
      backdrop-filter: blur(10px);
    }
    .badge-blue {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.2);
    }
    .badge-purple {
      background: rgba(129, 140, 248, 0.15);
      color: #818cf8;
      border: 1px solid rgba(129, 140, 248, 0.2);
    }

    /* Delete button */
    .btn-delete {
      padding: 6px 14px;
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      background: rgba(239, 68, 68, 0.1);
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(10px);
    }
    .btn-delete:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.5);
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.2);
    }

    /* Chart card - Liquid Glass Style */
    .chart-card {
      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.06) 0%,
        rgba(255, 255, 255, 0.02) 50%,
        rgba(255, 255, 255, 0.04) 100%
      );
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border-radius: 24px;
      padding: 24px;
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        inset 0 -1px 0 rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .chart-card:hover {
      transform: translateY(-2px);
      box-shadow:
        0 12px 40px rgba(59, 130, 246, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        inset 0 -1px 0 rgba(0, 0, 0, 0.2);
      border-color: rgba(59, 130, 246, 0.2);
    }

    .chart-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
      z-index: 1;
    }

    .chart-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.03), transparent);
      pointer-events: none;
    }

    .chart-card h3 {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      position: relative;
      z-index: 2;
    }

    .chart-card canvas {
      position: relative;
      z-index: 2;
    }

    /* Auth panel */
    .auth-card {
      max-width: 400px;
      margin: 0 auto;
      padding: 40px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* Table wrapper */
    .table-wrapper {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">

  <!-- Auth Panel -->
  <div id="auth-panel" class="hidden">
    <div class="apple-card auth-card">
      <h2 class="text-2xl font-bold text-white mb-2">后台登录</h2>
      <p class="text-[15px] text-gray-400 mb-8">请输入管理员账号和密码</p>
      <div class="space-y-4">
        <input type="email" id="admin-email" class="apple-input" placeholder="邮箱">
        <input type="password" id="admin-password" class="apple-input" placeholder="密码">
        <button id="btn-login" class="apple-btn apple-btn-primary w-full py-3" onclick="handleLogin()">登录</button>
        <p id="auth-error" class="text-[13px] text-red-400 hidden"></p>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div id="main-content" class="hidden max-w-7xl mx-auto">
    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
      <div>
        <h1 class="text-[28px] font-bold text-white tracking-tight">跨境电商行业调研统计</h1>
        <p class="text-[15px] text-gray-400 mt-1">共 <span id="total-count" class="font-semibold text-blue-400">0</span> 份问卷</p>
      </div>
      <div class="flex flex-wrap gap-2">
        <button onclick="exportCSV()" class="apple-btn apple-btn-secondary text-[13px]">导出 CSV</button>
        <button onclick="exportExcel()" class="apple-btn apple-btn-success text-[13px]">导出 Excel</button>
        <button onclick="exportPDF()" class="apple-btn apple-btn-purple text-[13px]">导出 PDF</button>
        <button onclick="clearAll()" class="apple-btn apple-btn-danger text-[13px]">清空全部</button>
      </div>
    </div>

    <!-- Filters -->
    <div class="apple-card p-5 mb-6">
      <div class="flex flex-wrap gap-3">
        <select id="filter-survey-type" class="apple-select" onchange="renderAll()">
          <option value="">全部问卷类型</option>
          <option value="shallow">快速调研</option>
          <option value="deep">深度调研</option>
        </select>
        <select id="filter-type" class="apple-select" onchange="renderAll()">
          <option value="">全部业务类型</option>
          <option value="平台卖家">平台卖家</option>
          <option value="独立站卖家">独立站卖家</option>
          <option value="两者都做">两者都做</option>
        </select>
        <select id="filter-exp" class="apple-select" onchange="renderAll()">
          <option value="">全部入行时间</option>
          <option value="半年以下">半年以下</option>
          <option value="半年-1年">半年-1年</option>
          <option value="1-3年">1-3年</option>
          <option value="3年以上">3年以上</option>
        </select>
        <select id="filter-revenue" class="apple-select" onchange="renderAll()">
          <option value="">全部月营收</option>
          <option value="5千以下">5千以下</option>
          <option value="5千-2万">5千-2万</option>
          <option value="2万-10万">2万-10万</option>
          <option value="10万-50万">10万-50万</option>
          <option value="50万以上">50万以上</option>
        </select>
      </div>
    </div>

    <!-- Charts Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 mb-8">
      <div class="chart-card">
        <h3>痛点评分雷达图</h3>
        <canvas id="radarChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>业务类型分布</h3>
        <canvas id="typeChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>入行时间分布</h3>
        <canvas id="expChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>月营收分布</h3>
        <canvas id="revenueChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>最耗时任务</h3>
        <canvas id="taskChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>AI 使用经验</h3>
        <canvas id="aiExpChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>AI 担忧因素</h3>
        <canvas id="aiConcernChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>付费意愿</h3>
        <canvas id="payChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>AI 期望价值</h3>
        <canvas id="aiValueChart"></canvas>
      </div>

      <!-- Deep survey charts -->
      <div class="chart-card deep-chart hidden">
        <h3>SKU 数量分布</h3>
        <canvas id="skuChart"></canvas>
      </div>
      <div class="chart-card deep-chart hidden">
        <h3>上架耗时分布</h3>
        <canvas id="listingTimeChart"></canvas>
      </div>
      <div class="chart-card deep-chart hidden">
        <h3>广告投放状态</h3>
        <canvas id="adStatusChart"></canvas>
      </div>
      <div class="chart-card deep-chart hidden">
        <h3>功能需求排名</h3>
        <canvas id="featureChart"></canvas>
      </div>
      <div class="chart-card deep-chart hidden">
        <h3>上架付费意愿</h3>
        <canvas id="listingPayChart"></canvas>
      </div>
      <div class="chart-card deep-chart hidden">
        <h3>创意付费意愿</h3>
        <canvas id="creativePayChart"></canvas>
      </div>
    </div>

    <!-- Data Table -->
    <div class="apple-card overflow-hidden mb-8">
      <div class="p-5 border-b border-white/10">
        <h3 class="text-[17px] font-semibold text-white">最新提交记录</h3>
      </div>
      <div class="overflow-x-auto" style="max-height: 500px;">
        <table class="data-table">
          <thead>
            <tr>
              <th>时间</th>
              <th>类型</th>
              <th>业务类型</th>
              <th>入行时间</th>
              <th>月营收</th>
              <th>AI经验</th>
              <th>联系方式</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="response-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let allResponses = [];
    let charts = {};

    // Liquid Glass color palette - vivid and bright
    const COLORS = [
      'rgba(96, 165, 250, 0.9)',    // Blue
      'rgba(129, 140, 248, 0.9)',   // Indigo
      'rgba(74, 222, 128, 0.9)',    // Green
      'rgba(253, 186, 116, 0.9)',   // Orange
      'rgba(252, 165, 165, 0.9)',   // Red
      'rgba(192, 132, 252, 0.9)',   // Purple
      'rgba(244, 114, 182, 0.9)',   // Pink
      'rgba(103, 232, 249, 0.9)',   // Light Blue
      'rgba(253, 224, 71, 0.9)',    // Yellow
      'rgba(94, 234, 212, 0.9)'     // Teal
    ];

    // Gradient colors for liquid glass effect - very bright
    const GRADIENT_COLORS = [
      { start: 'rgba(96, 165, 250, 0.7)', end: 'rgba(59, 130, 246, 0.35)' },
      { start: 'rgba(129, 140, 248, 0.7)', end: 'rgba(99, 102, 241, 0.35)' },
      { start: 'rgba(74, 222, 128, 0.7)', end: 'rgba(34, 197, 94, 0.35)' },
      { start: 'rgba(251, 146, 60, 0.7)', end: 'rgba(234, 88, 12, 0.35)' },
      { start: 'rgba(248, 113, 113, 0.7)', end: 'rgba(220, 38, 38, 0.35)' },
      { start: 'rgba(168, 85, 247, 0.7)', end: 'rgba(139, 92, 246, 0.35)' },
      { start: 'rgba(236, 72, 153, 0.7)', end: 'rgba(219, 39, 119, 0.35)' },
      { start: 'rgba(56, 189, 248, 0.7)', end: 'rgba(14, 165, 233, 0.35)' },
      { start: 'rgba(250, 204, 21, 0.7)', end: 'rgba(234, 179, 8, 0.35)' },
      { start: 'rgba(45, 212, 191, 0.7)', end: 'rgba(20, 184, 166, 0.35)' }
    ];

    const ALL_OPTIONS = {
      business_type: ['平台卖家', '独立站卖家', '两者都做'],
      experience: ['半年以下', '半年-1年', '1-3年', '3年以上'],
      revenue: ['5千以下', '5千-2万', '2万-10万', '10万-50万', '50万以上'],
      ai_experience: ['经常用', '偶尔用', '试过', '想试', '不考虑'],
      ai_value_expectation: ['节省时间', '提升质量', '降低成本', '快速上手', '一站式', '其他'],
      willing_to_pay: ['0', '99以下', '99-299', '300-599', '600以上'],
      time_consuming_tasks: ['商品上架', '广告素材', '竞品分析', '客服回复', '内容本地化', 'SEO优化', '数据分析', '其他'],
      ai_concerns: ['质量不稳定', '不够本地化', '需要大量修改', '学习成本高', '数据安全', '价格贵', '不了解', '其他'],
      sku_count: ['1-10', '11-50', '51-200', '201-1000', '1000以上'],
      listing_time: ['10分钟以下', '10-30分钟', '30-60分钟', '1-2小时', '2小时以上'],
      ad_status: ['在投', '测试中', '计划中', '没有'],
      top_features: ['商品文案', '广告创意', '竞品追踪', '多平台上架', '内容本地化', '客服回复', '数据分析', '其他'],
      pay_for_listing: ['0', '1-5元', '5-10元', '10-20元', '20元以上'],
      pay_for_creative: ['0', '99以下', '99-299', '300-599', '600以上']
    };

    function filterData() {
      const surveyType = document.getElementById('filter-survey-type').value;
      const type = document.getElementById('filter-type').value;
      const exp = document.getElementById('filter-exp').value;
      const rev = document.getElementById('filter-revenue').value;

      return allResponses.filter(r => {
        if (surveyType && r.survey_type !== surveyType) return false;
        if (type && r.business_type !== type) return false;
        if (exp && r.experience !== exp) return false;
        if (rev && r.revenue !== rev) return false;
        return true;
      });
    }

    function countField(data, field) {
      const opts = ALL_OPTIONS[field] || [];
      const counts = {};
      opts.forEach(o => counts[o] = 0);
      data.forEach(r => {
        const val = r[field];
        if (val && counts.hasOwnProperty(val)) counts[val]++;
      });
      return { labels: opts, values: opts.map(o => counts[o]) };
    }

    function countMultiField(data, field) {
      const opts = ALL_OPTIONS[field] || [];
      const counts = {};
      opts.forEach(o => counts[o] = 0);
      data.forEach(r => {
        const arr = r[field];
        if (Array.isArray(arr)) {
          arr.forEach(v => { if (counts.hasOwnProperty(v)) counts[v]++; });
        }
      });
      return { labels: opts, values: opts.map(o => counts[o]) };
    }

    function avgField(data, field) {
      const vals = data.map(r => r[field]).filter(v => typeof v === 'number');
      return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
    }

    function formatTime(isoString) {
      if (!isoString) return '';
      return new Date(isoString).toLocaleString('zh-CN', {
        timeZone: 'Asia/Shanghai',
        month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit',
        hour12: false
      }).replace(/\//g, '-');
    }

    function createGradient(ctx, colorIndex) {
      const gradient = ctx.createLinearGradient(0, 0, 0, 400);
      gradient.addColorStop(0, GRADIENT_COLORS[colorIndex % GRADIENT_COLORS.length].start);
      gradient.addColorStop(1, GRADIENT_COLORS[colorIndex % GRADIENT_COLORS.length].end);
      return gradient;
    }

    function renderBarChart(canvasId, result) {
      const ctx = document.getElementById(canvasId)?.getContext('2d');
      if (!ctx) return;
      if (charts[canvasId]) charts[canvasId].destroy();

      // Create gradients for each bar - same as pie chart
      const backgroundColors = result.labels.map((_, i) => {
        const gradient = ctx.createLinearGradient(0, 0, 0, ctx.canvas.height);
        gradient.addColorStop(0, GRADIENT_COLORS[i % GRADIENT_COLORS.length].start);
        gradient.addColorStop(1, GRADIENT_COLORS[i % GRADIENT_COLORS.length].end);
        return gradient;
      });

      charts[canvasId] = new Chart(ctx, {
        type: 'bar',
        data: {
          labels: result.labels,
          datasets: [{
            data: result.values,
            backgroundColor: backgroundColors,
            borderRadius: 12,
            maxBarThickness: 40,
            borderWidth: 0,
            borderSkipped: false,
            hoverBorderWidth: 2,
            hoverBorderColor: 'rgba(255, 255, 255, 0.4)'
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { display: false },
            tooltip: {
              backgroundColor: 'rgba(15, 23, 42, 0.95)',
              titleColor: 'rgba(255, 255, 255, 0.95)',
              bodyColor: 'rgba(255, 255, 255, 0.8)',
              borderColor: 'rgba(255, 255, 255, 0.15)',
              borderWidth: 1,
              cornerRadius: 12,
              padding: 14,
              displayColors: true,
              boxPadding: 6
            }
          },
          scales: {
            y: {
              beginAtZero: true,
              ticks: {
                stepSize: 1,
                font: { size: 11 },
                color: 'rgba(255, 255, 255, 0.4)',
                padding: 8
              },
              grid: {
                color: 'rgba(255, 255, 255, 0.06)',
                drawBorder: false
              },
              border: { display: false }
            },
            x: {
              ticks: {
                font: { size: 10 },
                maxRotation: 45,
                color: 'rgba(255, 255, 255, 0.4)',
                padding: 8
              },
              grid: {
                display: false
              },
              border: { display: false }
            }
          }
        }
      });
    }

    function createPieGradient(ctx, centerX, centerY, radius, colorIndex) {
      const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
      gradient.addColorStop(0, GRADIENT_COLORS[colorIndex % GRADIENT_COLORS.length].start);
      gradient.addColorStop(1, GRADIENT_COLORS[colorIndex % GRADIENT_COLORS.length].end);
      return gradient;
    }

    function renderPieChart(canvasId, data, labels) {
      const ctx = document.getElementById(canvasId)?.getContext('2d');
      if (!ctx) return;
      if (charts[canvasId]) charts[canvasId].destroy();

      // Create gradients for each slice
      const backgroundColors = labels.map((_, i) => {
        const centerX = ctx.canvas.width / 2;
        const centerY = ctx.canvas.height / 2;
        const radius = Math.min(centerX, centerY) * 0.8;
        return createPieGradient(ctx, centerX, centerY, radius, i);
      });

      charts[canvasId] = new Chart(ctx, {
        type: 'doughnut',
        data: {
          labels,
          datasets: [{
            data,
            backgroundColor: backgroundColors,
            borderWidth: 0,
            borderColor: 'transparent',
            hoverBorderWidth: 2,
            hoverBorderColor: 'rgba(255, 255, 255, 0.4)',
            hoverOffset: 8
          }]
        },
        options: {
          responsive: true,
          cutout: '68%',
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                font: { size: 11 },
                padding: 16,
                color: 'rgba(255, 255, 255, 0.6)',
                usePointStyle: true,
                pointStyle: 'circle'
              }
            },
            tooltip: {
              backgroundColor: 'rgba(15, 23, 42, 0.95)',
              titleColor: 'rgba(255, 255, 255, 0.95)',
              bodyColor: 'rgba(255, 255, 255, 0.8)',
              borderColor: 'rgba(255, 255, 255, 0.15)',
              borderWidth: 1,
              cornerRadius: 12,
              padding: 14,
              displayColors: true,
              boxPadding: 6
            }
          }
        }
      });
    }

    function renderRadarChart(data) {
      const ctx = document.getElementById('radarChart')?.getContext('2d');
      if (!ctx) return;
      if (charts['radarChart']) charts['radarChart'].destroy();

      const groups = {};
      data.forEach(r => {
        const t = r.business_type || '未知';
        if (!groups[t]) groups[t] = [];
        groups[t].push(r);
      });

      const labels = ['创意素材', '竞品情报', '多语言管理', '广告优化', '运营效率'];
      const fields = ['pain_creative', 'pain_intelligence', 'pain_multilingual', 'pain_ad_optimize', 'pain_efficiency'];

      // Radar chart uses its own color scheme
      const RADAR_COLORS = [
        'rgba(59, 130, 246, 0.85)',
        'rgba(99, 102, 241, 0.85)',
        'rgba(34, 197, 94, 0.85)',
        'rgba(251, 146, 60, 0.85)',
        'rgba(248, 113, 113, 0.85)',
        'rgba(168, 85, 247, 0.85)',
        'rgba(236, 72, 153, 0.85)',
        'rgba(56, 189, 248, 0.85)',
        'rgba(250, 204, 21, 0.85)',
        'rgba(45, 212, 191, 0.85)'
      ];

      charts['radarChart'] = new Chart(ctx, {
        type: 'radar',
        data: {
          labels,
          datasets: Object.entries(groups).map(([type, rows], i) => ({
            label: type,
            data: fields.map(f => Math.round(avgField(rows, f) * 10) / 10),
            borderColor: RADAR_COLORS[i],
            backgroundColor: RADAR_COLORS[i].replace('0.85', '0.15'),
            borderWidth: 2,
            pointBackgroundColor: RADAR_COLORS[i],
            pointBorderColor: 'rgba(255, 255, 255, 0.3)',
            pointBorderWidth: 1,
            pointRadius: 4,
            pointHoverRadius: 6
          }))
        },
        options: {
          responsive: true,
          scales: {
            r: {
              min: 0,
              max: 5,
              ticks: {
                stepSize: 1,
                color: 'rgba(255, 255, 255, 0.4)',
                backdropColor: 'transparent',
                font: { size: 10 }
              },
              grid: {
                color: 'rgba(255, 255, 255, 0.08)',
                circular: true
              },
              angleLines: {
                color: 'rgba(255, 255, 255, 0.08)'
              },
              pointLabels: {
                color: 'rgba(255, 255, 255, 0.6)',
                font: { size: 11, weight: '500' }
              }
            }
          },
          plugins: {
            legend: {
              position: 'bottom',
              labels: {
                font: { size: 11 },
                color: 'rgba(255, 255, 255, 0.6)',
                usePointStyle: true,
                pointStyle: 'circle',
                padding: 16
              }
            },
            tooltip: {
              backgroundColor: 'rgba(15, 23, 42, 0.9)',
              titleColor: 'rgba(255, 255, 255, 0.9)',
              bodyColor: 'rgba(255, 255, 255, 0.7)',
              borderColor: 'rgba(255, 255, 255, 0.1)',
              borderWidth: 1,
              cornerRadius: 12,
              padding: 12
            }
          }
        }
      });
    }

    function renderTable(data) {
      const tbody = document.getElementById('response-body');
      tbody.innerHTML = data.map(r => {
        const contact = r.contact_wechat || r.contact_phone || r.contact_email || '-';
        const typeBadge = r.survey_type === 'deep'
          ? '<span class="badge badge-purple">深度</span>'
          : '<span class="badge badge-blue">快速</span>';

        return `
          <tr>
            <td>${formatTime(r.created_at)}</td>
            <td>${typeBadge}</td>
            <td>${r.business_type || '-'}</td>
            <td>${r.experience || '-'}</td>
            <td>${r.revenue || '-'}</td>
            <td>${r.ai_experience || '-'}</td>
            <td>${contact}</td>
            <td><button class="btn-delete" onclick="deleteOne('${r.id}')">删除</button></td>
          </tr>
        `;
      }).join('');
    }

    function renderAll() {
      const data = filterData();
      document.getElementById('total-count').textContent = data.length;

      // Show/hide deep charts
      const hasDeep = data.some(r => r.survey_type === 'deep');
      document.querySelectorAll('.deep-chart').forEach(el => {
        el.classList.toggle('hidden', !hasDeep);
      });

      // Basic charts
      renderRadarChart(data);
      renderPieChart('typeChart', countField(data, 'business_type').values, ALL_OPTIONS.business_type);
      renderPieChart('expChart', countField(data, 'experience').values, ALL_OPTIONS.experience);
      renderPieChart('revenueChart', countField(data, 'revenue').values, ALL_OPTIONS.revenue);
      renderBarChart('taskChart', countMultiField(data, 'time_consuming_tasks'));
      renderPieChart('aiExpChart', countField(data, 'ai_experience').values, ALL_OPTIONS.ai_experience);
      renderBarChart('aiConcernChart', countMultiField(data, 'ai_concerns'));
      renderBarChart('payChart', countField(data, 'willing_to_pay'));
      renderPieChart('aiValueChart', countField(data, 'ai_value_expectation').values, ALL_OPTIONS.ai_value_expectation);

      // Deep charts
      if (hasDeep) {
        renderBarChart('skuChart', countField(data, 'sku_count'));
        renderBarChart('listingTimeChart', countField(data, 'listing_time'));
        renderPieChart('adStatusChart', countField(data, 'ad_status').values, ALL_OPTIONS.ad_status);
        renderBarChart('featureChart', countMultiField(data, 'top_features'));
        renderBarChart('listingPayChart', countField(data, 'pay_for_listing'));
        renderBarChart('creativePayChart', countField(data, 'pay_for_creative'));
      }

      renderTable(data);
    }

    // Export functions
    function exportCSV() {
      const data = filterData();
      const headers = ['时间', '类型', '业务类型', '入行时间', '月营收', 'AI经验', '联系方式'];
      const rows = data.map(r => [
        r.created_at,
        r.survey_type === 'deep' ? '深度' : '快速',
        r.business_type || '',
        r.experience || '',
        r.revenue || '',
        r.ai_experience || '',
        r.contact_wechat || r.contact_phone || r.contact_email || ''
      ]);
      const csv = '﻿' + [headers, ...rows].map(row => row.map(v => `"${String(v || '').replace(/"/g, '""')}"`).join(',')).join('\n');
      download(csv, 'survey_export.csv', 'text/csv;charset=utf-8');
    }

    function exportExcel() {
      const data = filterData();
      const wb = XLSX.utils.book_new();

      const ws = XLSX.utils.json_to_sheet(data.map(r => ({
        '提交时间': r.created_at,
        '问卷类型': r.survey_type === 'deep' ? '深度' : '快速',
        '业务类型': r.business_type,
        '入行时间': r.experience,
        '月营收': r.revenue,
        'AI经验': r.ai_experience,
        '最耗时任务': Array.isArray(r.time_consuming_tasks) ? r.time_consuming_tasks.join(', ') : '',
        'AI担忧': Array.isArray(r.ai_concerns) ? r.ai_concerns.join(', ') : '',
        '付费意愿': r.willing_to_pay,
        '联系方式': r.contact_wechat || r.contact_phone || r.contact_email || ''
      })));
      XLSX.utils.book_append_sheet(wb, ws, '调研数据');
      XLSX.writeFile(wb, 'survey_export.xlsx');
    }

    function exportPDF() {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF('l', 'mm', 'a4');

      doc.setFontSize(18);
      doc.text('CrossPilot Survey Report', 14, 20);
      doc.setFontSize(10);
      doc.text(`Generated: ${new Date().toLocaleString('zh-CN')}`, 14, 28);

      const data = filterData();
      doc.setFontSize(12);
      doc.text(`Total: ${data.length} | Shallow: ${data.filter(r => r.survey_type !== 'deep').length} | Deep: ${data.filter(r => r.survey_type === 'deep').length}`, 14, 38);

      doc.autoTable({
        head: [['Time', 'Type', 'Business', 'Experience', 'Revenue', 'AI Experience']],
        body: data.slice(0, 50).map(r => [
          formatTime(r.created_at),
          r.survey_type === 'deep' ? 'Deep' : 'Quick',
          r.business_type || '',
          r.experience || '',
          r.revenue || '',
          r.ai_experience || ''
        ]),
        startY: 45,
        styles: { fontSize: 8 },
        headStyles: { fillColor: [0, 113, 227] }
      });

      doc.save('survey_report.pdf');
    }

    function download(content, filename, type) {
      const url = URL.createObjectURL(new Blob([content], { type }));
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    // CRUD
    function deleteOne(id) {
      if (!confirm('确定删除这条数据？')) return;
      window.CrossPilotData.deleteResponse(id).then(loadData).catch(err => alert('删除失败'));
    }

    function clearAll() {
      if (!confirm('确定清空所有数据？此操作不可撤销！')) return;
      if (!confirm('再次确认：删除全部数据？')) return;
      window.CrossPilotData.clearResponses(allResponses).then(loadData).catch(err => alert('清空失败'));
    }

    function loadData() {
      window.CrossPilotData.loadResponses().then(data => {
        allResponses = data.responses || [];
        renderAll();
      }).catch(err => {
        document.getElementById('total-count').textContent = '加载失败';
      });
    }

    // Auth
    function handleLogin() {
      const email = document.getElementById('admin-email').value.trim();
      const password = document.getElementById('admin-password').value;
      const errorEl = document.getElementById('auth-error');

      if (!email || !password) {
        errorEl.textContent = '请输入邮箱和密码';
        errorEl.classList.remove('hidden');
        return;
      }

      errorEl.classList.add('hidden');
      const btn = document.getElementById('btn-login');
      btn.disabled = true;
      btn.textContent = '登录中...';

      window.CrossPilotData.login(email, password)
        .catch(err => {
          errorEl.textContent = err.message || '登录失败';
          errorEl.classList.remove('hidden');
        })
        .finally(() => {
          btn.disabled = false;
          btn.textContent = '登录';
        });
    }

    // Init
    window.CrossPilotData.onAuthChange(user => {
      if (!window.CrossPilotData.supabaseEnabled()) {
        document.getElementById('auth-panel').classList.add('hidden');
        document.getElementById('main-content').classList.remove('hidden');
        loadData();
        return;
      }

      if (window.CrossPilotData.isAllowedAdmin(user)) {
        document.getElementById('auth-panel').classList.add('hidden');
        document.getElementById('main-content').classList.remove('hidden');
        loadData();
      } else {
        document.getElementById('auth-panel').classList.remove('hidden');
        document.getElementById('main-content').classList.add('hidden');
      }
    });

    // Auto-refresh
    setInterval(loadData, 30000);
  </script>
</body>
</html>
