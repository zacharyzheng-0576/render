<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>调研数据统计 — CrossPilot</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            'apple': ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', 'Arial', 'sans-serif']
          }
        }
      }
    }
  </script>
  <script src="assets/chart.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.2/dist/jspdf.plugin.autotable.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
  <script src="supabase-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="data-service.js"></script>
  <style>
    * { box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'PingFang SC', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background: #000000;
      color: #F5F5F7;
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      position: relative;
    }

    /* 底部 indigo 渐变 */
    body::after {
      content: '';
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 50vh;
      background: linear-gradient(
        to top,
        rgba(79, 70, 229, 0.2) 0%,
        rgba(99, 102, 241, 0.1) 25%,
        rgba(99, 102, 241, 0.05) 50%,
        transparent 100%
      );
      pointer-events: none;
      z-index: 0;
    }

    .admin-container {
      position: relative;
      z-index: 1;
    }

    /* Liquid Glass Card */
    .apple-card {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.08) 0%,
        rgba(255, 255, 255, 0.04) 50%,
        rgba(255, 255, 255, 0.06) 100%
      );
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border-radius: 20px;
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.3),
        inset 0 1px 0 rgba(255, 255, 255, 0.1),
        inset 0 -1px 0 rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.12);
      position: relative;
      overflow: hidden;
    }

    .apple-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
      z-index: 1;
    }

    /* Glass Button */
    .apple-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 10px 20px;
      border-radius: 100px;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
      cursor: pointer;
      border: none;
      outline: none;
      position: relative;
      overflow: hidden;
    }

    .apple-btn-primary {
      background: linear-gradient(135deg, rgba(37, 99, 235, 0.9) 0%, rgba(59, 130, 246, 0.95) 100%);
      color: #FFFFFF;
      box-shadow:
        0 4px 16px rgba(37, 99, 235, 0.35),
        inset 0 1px 0 rgba(255, 255, 255, 0.2);
      backdrop-filter: blur(10px);
    }
    .apple-btn-primary::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.2), transparent);
      border-radius: 100px 100px 0 0;
      pointer-events: none;
    }
    .apple-btn-primary:hover {
      background: linear-gradient(135deg, rgba(29, 78, 216, 0.95) 0%, rgba(37, 99, 235, 1) 100%);
      box-shadow: 0 8px 24px rgba(37, 99, 235, 0.45);
      transform: translateY(-1px);
    }

    .apple-btn-secondary {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%);
      color: #FFFFFF;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(20px);
    }
    .apple-btn-secondary::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.1), transparent);
      border-radius: 100px 100px 0 0;
      pointer-events: none;
    }
    .apple-btn-secondary:hover {
      background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.08) 100%);
      border-color: rgba(255, 255, 255, 0.25);
    }

    .apple-btn-danger {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.08) 0%,
        rgba(239, 68, 68, 0.15) 100%
      );
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.25);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(20px);
    }
    .apple-btn-danger::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.08), transparent);
      border-radius: 100px 100px 0 0;
      pointer-events: none;
    }
    .apple-btn-danger:hover {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.12) 0%,
        rgba(239, 68, 68, 0.2) 100%
      );
      border-color: rgba(239, 68, 68, 0.35);
      box-shadow: 0 4px 16px rgba(239, 68, 68, 0.15);
    }

    .apple-btn-success {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.08) 0%,
        rgba(34, 197, 94, 0.15) 100%
      );
      color: #4ade80;
      border: 1px solid rgba(34, 197, 94, 0.25);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(20px);
    }
    .apple-btn-success::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.08), transparent);
      border-radius: 100px 100px 0 0;
      pointer-events: none;
    }
    .apple-btn-success:hover {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.12) 0%,
        rgba(34, 197, 94, 0.2) 100%
      );
      border-color: rgba(34, 197, 94, 0.35);
      box-shadow: 0 4px 16px rgba(34, 197, 94, 0.15);
    }

    .apple-btn-purple {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.08) 0%,
        rgba(129, 140, 248, 0.15) 100%
      );
      color: #a5b4fc;
      border: 1px solid rgba(129, 140, 248, 0.25);
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(20px);
    }
    .apple-btn-purple::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.08), transparent);
      border-radius: 100px 100px 0 0;
      pointer-events: none;
    }
    .apple-btn-purple:hover {
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.12) 0%,
        rgba(129, 140, 248, 0.2) 100%
      );
      border-color: rgba(129, 140, 248, 0.35);
      box-shadow: 0 4px 16px rgba(129, 140, 248, 0.15);
    }

    /* Glass Input */
    .apple-input {
      width: 100%;
      padding: 12px 16px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      font-size: 15px;
      outline: none;
      transition: all 0.3s ease;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.06) 0%,
        rgba(255, 255, 255, 0.03) 100%
      );
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: #F5F5F7;
    }
    .apple-input:focus {
      border-color: rgba(59, 130, 246, 0.5);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.15);
    }
    .apple-input::placeholder {
      color: rgba(255, 255, 255, 0.35);
    }

    .apple-select {
      padding: 10px 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      background: linear-gradient(
        135deg,
        rgba(255, 255, 255, 0.06) 0%,
        rgba(255, 255, 255, 0.03) 100%
      );
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      color: #F5F5F7;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .apple-select:focus {
      border-color: rgba(59, 130, 246, 0.5);
    }
    .apple-select option {
      background: #1C1C1E;
      color: #F5F5F7;
    }

    /* Table styles */
    .data-table {
      width: 100%;
      border-collapse: collapse;
    }
    .data-table th {
      padding: 12px 16px;
      text-align: left;
      font-size: 11px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.5);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      background: rgba(255, 255, 255, 0.03);
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
    }
    .data-table td {
      padding: 14px 16px;
      font-size: 14px;
      color: #F5F5F7;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    .data-table tr:hover td {
      background: rgba(255, 255, 255, 0.03);
    }

    /* Badge styles */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 4px 12px;
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
      backdrop-filter: blur(10px);
    }
    .badge-blue {
      background: rgba(59, 130, 246, 0.15);
      color: #60a5fa;
      border: 1px solid rgba(59, 130, 246, 0.2);
    }
    .badge-purple {
      background: rgba(129, 140, 248, 0.15);
      color: #818cf8;
      border: 1px solid rgba(129, 140, 248, 0.2);
    }

    /* Delete button */
    .btn-delete {
      padding: 6px 14px;
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      background: rgba(239, 68, 68, 0.1);
      border-radius: 100px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(10px);
    }
    .btn-delete:hover {
      background: rgba(239, 68, 68, 0.2);
      border-color: rgba(239, 68, 68, 0.5);
      box-shadow: 0 0 12px rgba(239, 68, 68, 0.2);
    }

    /* Chart card - Liquid Glass Style */
    .chart-card {
      background: linear-gradient(
        145deg,
        rgba(255, 255, 255, 0.06) 0%,
        rgba(255, 255, 255, 0.02) 50%,
        rgba(255, 255, 255, 0.04) 100%
      );
      backdrop-filter: blur(40px) saturate(180%);
      -webkit-backdrop-filter: blur(40px) saturate(180%);
      border-radius: 24px;
      padding: 24px;
      box-shadow:
        0 8px 32px rgba(0, 0, 0, 0.4),
        inset 0 1px 0 rgba(255, 255, 255, 0.08),
        inset 0 -1px 0 rgba(0, 0, 0, 0.2);
      border: 1px solid rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
      transition: all 0.3s ease;
    }

    .chart-card:hover {
      transform: translateY(-2px);
      box-shadow:
        0 12px 40px rgba(59, 130, 246, 0.1),
        inset 0 1px 0 rgba(255, 255, 255, 0.12),
        inset 0 -1px 0 rgba(0, 0, 0, 0.2);
      border-color: rgba(59, 130, 246, 0.2);
    }

    .chart-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 1px;
      background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.25), transparent);
      z-index: 1;
    }

    .chart-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 50%;
      background: linear-gradient(to bottom, rgba(255, 255, 255, 0.03), transparent);
      pointer-events: none;
    }

    .chart-card h3 {
      font-size: 13px;
      font-weight: 600;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      position: relative;
      z-index: 2;
    }

    .chart-card canvas {
      position: relative;
      z-index: 2;
    }

    /* Auth panel */
    .auth-card {
      max-width: 400px;
      margin: 0 auto;
      padding: 40px;
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    /* Table wrapper */
    .table-wrapper {
      background: rgba(0, 0, 0, 0.2);
      border-radius: 16px;
      border: 1px solid rgba(255, 255, 255, 0.08);
      overflow: hidden;
    }
  </style>
</head>
<body class="min-h-screen p-4 md:p-8">

  <!-- Auth Panel -->
  <div id="auth-panel" class="hidden">
    <div class="apple-card auth-card">
      <h2 class="text-2xl font-bold text-white mb-2">后台登录</h2>
      <p class="text-[15px] text-gray-400 mb-8">请输入管理员账号和密码</p>
      <div class="space-y-4">
        <input type="email" id="admin-email" class="apple-input" placeholder="邮箱">
        <input type="password" id="admin-password" class="apple-input" placeholder="密码">
        <button id="btn-login" class="apple-btn apple-btn-primary w-full py-3" onclick="handleLogin()">登录</button>
        <p id="auth-error" class="text-[13px] text-red-400 hidden"></p>
      </div>
    </div>
  </div>

  <!-- Main Content -->
  <div id="main-content" class="hidden max-w-7xl mx-auto">
    <!-- Header -->
    <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-8 gap-4">
      <div>
        <h1 class="text-[28px] font-bold text-white tracking-tight">跨境电商行业调研统计</h1>
        <p class="text-[15px] text-gray-400 mt-1">共 <span id="total-count" class="font-semibold text-blue-400">0</span> 份问卷</p>
      </div>
      <div class="flex flex-wrap gap-2">
        <button onclick="exportCSV()" class="apple-btn apple-btn-secondary text-[13px]">导出 CSV</button>
        <button onclick="exportExcel()" class="apple-btn apple-btn-success text-[13px]">导出 Excel</button>
        <button onclick="exportPDF()" class="apple-btn apple-btn-purple text-[13px]">导出 PDF</button>
        <button onclick="clearAll()" class="apple-btn apple-btn-danger text-[13px]">清空全部</button>
      </div>
    </div>

    <!-- Filters -->
    <div class="apple-card p-5 mb-6">
      <div class="flex flex-wrap gap-3">
        <select id="filter-survey-type" class="apple-select" onchange="renderAll()">
          <option value="">全部问卷类型</option>
          <option value="shallow">快速调研</option>
          <option value="deep">深度调研</option>
        </select>
        <select id="filter-type" class="apple-select" onchange="renderAll()">
          <option value="">全部业务类型</option>
          <option value="独立站卖家">独立站卖家</option>
          <option value="平台卖家">平台卖家</option>
          <option value="两者都做">两者都做</option>
        </select>
        <select id="filter-market" class="apple-select" onchange="renderAll()">
          <option value="">全部目标市场</option>
          <option value="北美">北美</option>
          <option value="欧洲">欧洲</option>
          <option value="东南亚">东南亚</option>
          <option value="日韩">日韩</option>
          <option value="中东">中东</option>
          <option value="拉美">拉美</option>
          <option value="全球">全球</option>
        </select>
        <select id="filter-ad-spend" class="apple-select" onchange="renderAll()">
          <option value="">全部广告投入</option>
          <option value="0">目前不投广告</option>
          <option value="5千以下">¥5,000 以下</option>
          <option value="5千-2万">¥5,000 ~ ¥20,000</option>
          <option value="2万-10万">¥20,000 ~ ¥100,000</option>
          <option value="10万以上">¥100,000+</option>
        </select>
      </div>
    </div>

    <!-- Charts Grid -->
    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5 mb-8">
      <div class="chart-card">
        <h3>业务类型分布</h3>
        <canvas id="typeChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>目标市场分布</h3>
        <canvas id="marketChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>月广告投入分布</h3>
        <canvas id="adSpendChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>素材更新频率</h3>
        <canvas id="creativeFreqChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>最大创意挑战</h3>
        <canvas id="creativeChallengeChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>竞品追踪方式</h3>
        <canvas id="competitorChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>转化率满意度</h3>
        <canvas id="conversionChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>商品页问题</h3>
        <canvas id="pageIssuesChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>AI 使用经验</h3>
        <canvas id="aiExpChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>AI 期望功能</h3>
        <canvas id="aiExpectationChart"></canvas>
      </div>
      <div class="chart-card">
        <h3>付费意愿</h3>
        <canvas id="payChart"></canvas>
      </div>

      <!-- Deep survey charts -->
      <div class="chart-card deep-chart hidden">
        <h3>广告平台分布</h3>
        <canvas id="adPlatformChart"></canvas>
      </div>
      <div class="chart-card deep-chart hidden">
        <h3>月素材数量</h3>
        <canvas id="creativeCountChart"></canvas>
      </div>
      <div class="chart-card deep-chart hidden">
        <h3>创意来源</h3>
        <canvas id="creativeSourceChart"></canvas>
      </div>
      <div class="chart-card deep-chart hidden">
        <h3>创意痛点详情</h3>
        <canvas id="creativePainDetailChart"></canvas>
      </div>
      <div class="chart-card deep-chart hidden">
        <h3>页面优化耗时</h3>
        <canvas id="pageTimeChart"></canvas>
      </div>
      <div class="chart-card deep-chart hidden">
        <h3>页面重要元素</h3>
        <canvas id="pageElementsChart"></canvas>
      </div>
      <div class="chart-card deep-chart hidden">
        <h3>市场准备度检查</h3>
        <canvas id="marketCheckChart"></canvas>
      </div>
      <div class="chart-card deep-chart hidden">
        <h3>竞品分析频率</h3>
        <canvas id="competitorFreqChart"></canvas>
      </div>
      <div class="chart-card deep-chart hidden">
        <h3>竞品分析内容</h3>
        <canvas id="competitorContentChart"></canvas>
      </div>
      <div class="chart-card deep-chart hidden">
        <h3>创意追踪付费意愿</h3>
        <canvas id="payCreativeScoutChart"></canvas>
      </div>
      <div class="chart-card deep-chart hidden">
        <h3>页面优化付费意愿</h3>
        <canvas id="payPageOptimizeChart"></canvas>
      </div>
      <div class="chart-card deep-chart hidden">
        <h3>最有价值功能</h3>
        <canvas id="valuableFeaturesChart"></canvas>
      </div>
    </div>

    <!-- Data Table -->
    <div class="apple-card overflow-hidden mb-8">
      <div class="p-5 border-b border-white/10">
        <h3 class="text-[17px] font-semibold text-white">最新提交记录</h3>
      </div>
      <div class="overflow-x-auto" style="max-height: 500px;">
        <table class="data-table">
          <thead>
            <tr>
              <th>时间</th>
              <th>类型</th>
              <th>业务类型</th>
              <th>目标市场</th>
              <th>月广告投入</th>
              <th>AI经验</th>
              <th>联系方式</th>
              <th>操作</th>
            </tr>
          </thead>
          <tbody id="response-body"></tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    let allResponses = [];
    let charts = {};

    // Liquid Glass color palette - vivid and bright
    const COLORS = [
      'rgba(96, 165, 250, 0.9)',    // Blue
      'rgba(129, 140, 248, 0.9)',   // Indigo
      'rgba(74, 222, 128, 0.9)',    // Green
      'rgba(253, 186, 116, 0.9)',   // Orange
      'rgba(252, 165, 165, 0.9)',   // Red
      'rgba(192, 132, 252, 0.9)',   // Purple
      'rgba(244, 114, 182, 0.9)',   // Pink

    function filterData() {
      const surveyType = document.getElementById('filter-survey-type').value;
      const type = document.getElementById('filter-type').value;
      const market = document.getElementById('filter-market').value;
      const adSpend = document.getElementById('filter-ad-spend').value;

      return allResponses.filter(r => {
        if (surveyType && r.survey_type !== surveyType) return false;
        if (type && r.business_type !== type) return false;
        if (market && r.main_market !== market) return false;
        if (adSpend && r.monthly_ad_spend !== adSpend) return false;
        return true;
      });
    }

    function countField(data, field) {
      const opts = ALL_OPTIONS[field] || [];
      const labels = [...opts];
      const counts = {};
      labels.forEach(o => counts[o] = 0);
      const fallbackLabel = labels.includes('其他') ? '其他' : '其他/自定义';
      data.forEach(r => {
        const val = r[field];
        if (!val) return;
        if (counts.hasOwnProperty(val)) {
          counts[val]++;
        } else {
          if (!counts.hasOwnProperty(fallbackLabel)) {
            labels.push(fallbackLabel);
            counts[fallbackLabel] = 0;
          }
          counts[fallbackLabel]++;
        }
      });
      return { labels, values: labels.map(o => counts[o]) };
    }

    function countMultiField(data, field) {
      const opts = ALL_OPTIONS[field] || [];
      const labels = [...opts];
      const counts = {};
      labels.forEach(o => counts[o] = 0);
      const fallbackLabel = labels.includes('其他') ? '其他' : '其他/自定义';
      data.forEach(r => {
        const arr = r[field];
        if (Array.isArray(arr)) {
          arr.forEach(v => {
            if (counts.hasOwnProperty(v)) {
              counts[v]++;
            } else if (v) {
              if (!counts.hasOwnProperty(fallbackLabel)) {
                labels.push(fallbackLabel);
                counts[fallbackLabel] = 0;
              }
              counts[fallbackLabel]++;
            }
          });
        }
      });
      return { labels, values: labels.map(o => counts[o]) };
    }

    function avgField(data, field) {
      const vals = data.map(r => r[field]).filter(v => typeof v === 'number');
      return vals.length ? vals.reduce((a, b) => a + b, 0) / vals.length : 0;
    }

    function formatTime(isoString) {
      if (!isoString) return '';
      return new Date(isoString).toLocaleString('zh-CN', {
        timeZone: 'Asia/Shanghai',
        month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit',
        hour12: false
      }).replace(/\//g, '-');
    }

      const gradient = ctx.createLinearGradient(0, 0, 0, 400);
      gradient.addColorStop(0, GRADIENT_COLORS[colorIndex % GRADIENT_COLORS.length].start);
      gradient.addColorStop(1, GRADIENT_COLORS[colorIndex % GRADIENT_COLORS.length].end);
      return gradient;
    }

    function createPieGradient(ctx, centerX, centerY, radius, colorIndex) {
      const gradient = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, radius);
      gradient.addColorStop(0, GRADIENT_COLORS[colorIndex % GRADIENT_COLORS.length].start);
      gradient.addColorStop(1, GRADIENT_COLORS[colorIndex % GRADIENT_COLORS.length].end);
      return gradient;
    }

        return createPieGradient(ctx, centerX, centerY, radius, i);

      })));

    function escapeHtml(value) {
      return String(value ?? '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function formatPdfValue(value) {
      if (Array.isArray(value)) return value.length ? value.join('、') : '-';
      if (value === undefined || value === null || value === '') return '-';
      return String(value);
    }

    function formatPdfDate(value) {
      if (!value) return '-';
      return new Date(value).toLocaleString('zh-CN', {
        timeZone: 'Asia/Shanghai',
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        hour12: false
      }).replace(/\//g, '-');
    }

    function chunkArray(items, size) {
      const chunks = [];
      for (let i = 0; i < items.length; i += size) chunks.push(items.slice(i, i + size));
      return chunks;
    }

    function getSelectedText(id) {
      const el = document.getElementById(id);
      if (!el) return '全部';
      return el.options[el.selectedIndex]?.textContent || '全部';
    }

    function getPdfFilterSummary() {
      return [
        ['问卷类型', getSelectedText('filter-survey-type')],
        ['业务类型', getSelectedText('filter-type')],
        ['目标市场', getSelectedText('filter-market')],
        ['广告投入', getSelectedText('filter-ad-spend')]
      ];
    }

    function getVisiblePdfCharts() {
      return PDF_CHART_DEFINITIONS.filter(def => {
        const canvas = document.getElementById(def.id);
        const card = canvas?.closest('.chart-card');
        return Boolean(canvas && card && getComputedStyle(card).display !== 'none' && charts[def.id]);
      });
    }

    function getPdfChartResult(def, data) {
      return def.mode === 'multi'
        ? countMultiField(data, def.field)
        : countField(data, def.field);
    }

    function percentText(value, denominator) {
      if (!denominator) return '0%';
      return `${Math.round((value / denominator) * 1000) / 10}%`;
    }

    function getPdfResponseFields(row) {
      const base = [
        ['提交时间', formatPdfDate(row.created_at), 'created_at'],
        ['问卷类型', row.survey_type === 'deep' ? '深度调研' : '快速调研', 'survey_type'],
        ['业务类型', row.business_type, 'business_type'],
        ['目标市场', row.main_market, 'main_market'],
        ['月广告投入', row.monthly_ad_spend, 'monthly_ad_spend'],
        ['素材更新频率', row.creative_refresh_frequency, 'creative_refresh_frequency'],
        ['最大创意挑战', row.biggest_creative_challenge, 'biggest_creative_challenge'],
        ['竞品追踪方式', row.competitor_tracking, 'competitor_tracking'],
        ['转化率满意度', row.conversion_rate_concern, 'conversion_rate_concern'],
        ['商品页问题', row.product_page_issues, 'product_page_issues'],
        ['AI 使用经验', row.ai_experience, 'ai_experience'],
        ['AI 期望功能', row.ai_expectation, 'ai_expectation'],
        ['付费意愿', row.willing_to_pay, 'willing_to_pay'],
        ['广告平台', row.ad_platforms, 'ad_platforms'],
        ['月素材数量', row.monthly_creative_count, 'monthly_creative_count'],
        ['创意来源', row.creative_source, 'creative_source'],
        ['创意痛点详情', row.creative_pain_detail, 'creative_pain_detail'],
        ['页面优化耗时', row.product_page_time, 'product_page_time'],
        ['页面重要元素', row.product_page_elements, 'product_page_elements'],
        ['市场准备度检查', row.market_readiness_need, 'market_readiness_need'],
        ['竞品分析频率', row.competitor_analysis_frequency, 'competitor_analysis_frequency'],
        ['竞品分析内容', row.competitor_analysis_content, 'competitor_analysis_content'],
        ['创意追踪付费意愿', row.pay_for_creative_scout, 'pay_for_creative_scout'],
        ['页面优化付费意愿', row.pay_for_page_optimize, 'pay_for_page_optimize'],
        ['最有价值功能', row.most_valuable_features, 'most_valuable_features'],
        ['是否愿意访谈', row.willing_interview, 'willing_interview'],
        ['微信', row.contact_wechat, 'contact_wechat'],
        ['手机', row.contact_phone, 'contact_phone'],
        ['邮箱', row.contact_email, 'contact_email'],
        ['LinkedIn', row.contact_linkedin, 'contact_linkedin']
      ];
      const usedKeys = new Set(base.map(([, , key]) => key));
      const customFields = Object.entries(row)
        .filter(([key, value]) => key.endsWith('_other') && !usedKeys.has(key) && formatPdfValue(value) !== '-')
        .map(([key, value]) => [`其他补充（${key.replace(/_other$/, '')}）`, value, key]);

      return [...base, ...customFields]
        .map(([label, value]) => [label, value])
        .filter(([, value]) => formatPdfValue(value) !== '-');
    }

    function createPdfPage(className, bodyHtml, footerText = '') {
      const page = document.createElement('section');
      page.className = `pdf-page ${className || ''}`;
      page.innerHTML = `${bodyHtml}<div class="pdf-footer"><span>CrossPilot AI Survey Report</span><span>${escapeHtml(footerText)}</span></div>`;

    function withTimeout(promise, ms, label) {
      let timer;
      const timeout = new Promise((_, reject) => {
        timer = setTimeout(() => reject(new Error(`${label} 超时，请稍后重试`)), ms);
      });
      return Promise.race([promise, timeout]).finally(() => clearTimeout(timer));
    }

    function updatePdfStatus(button, text) {
      if (button) button.textContent = text;
    }

    async function waitForImages(el, timeoutMs = 5000) {
      const imgs = Array.from(el.querySelectorAll('img'));
      const loadPromise = Promise.all(imgs.map(img => {
        if (img.complete) return Promise.resolve();
        return new Promise(resolve => {
          img.onload = resolve;
          img.onerror = resolve;
        });
      }));
      await withTimeout(loadPromise, timeoutMs, '图片加载');
    }

    async function addElementAsPdfPage(doc, host, page, state, label = '页面渲染') {
      host.appendChild(page);
      await waitForImages(page);
      await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
      const canvas = await withTimeout(
        html2canvas(page, {
          scale: 1.5,
          backgroundColor: '#f5f7fb',
          useCORS: true,
          logging: false,
          removeContainer: true
        }),
        12000,
        label
      );
      const img = canvas.toDataURL('image/png');
      if (!state.first) doc.addPage();
      doc.addImage(img, 'PNG', 0, 0, 297, 210);
      state.first = false;
      page.remove();
    }

    function captureChartShots(chartDefs) {
      return chartDefs.map(def => {
        const canvas = document.getElementById(def.id);
        if (!canvas) return null;
        if (charts[def.id] && typeof charts[def.id].update === 'function') {
          charts[def.id].update('none');
        }
        return {
          title: def.title,
          src: canvas.toDataURL('image/png', 1)
        };
      }).filter(Boolean);
    }

    async function exportPDF() {
      if (!window.jspdf || !window.jspdf.jsPDF || !window.html2canvas) {
        alert('PDF 导出依赖没有加载完成，请刷新页面后重试');
        return;
      }

      const button = document.querySelector('button[onclick="exportPDF()"]');
      const originalText = button ? button.textContent : '';
      if (button) {
        button.disabled = true;
        button.textContent = '生成 PDF 中...';
      }

      let host = null;
      try {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF({ orientation: 'landscape', unit: 'mm', format: 'a4', compress: true });
        const data = filterData();
        const chartDefs = getVisiblePdfCharts();
        updatePdfStatus(button, '整理图表...');
        await new Promise(resolve => requestAnimationFrame(() => requestAnimationFrame(resolve)));
        const chartShots = captureChartShots(chartDefs);

        host = createPdfHost();
        const state = { first: true };

        updatePdfStatus(button, '生成封面...');
        await addElementAsPdfPage(doc, host, buildCoverPage(data, chartShots.length), state, '封面渲染');

        if (chartShots.length) {
          const chartChunks = chunkArray(chartShots, 4);
          for (let i = 0; i < chartChunks.length; i++) {
            updatePdfStatus(button, `生成图表 ${i + 1}/${chartChunks.length}...`);
            await addElementAsPdfPage(doc, host, buildChartPage(chartChunks[i], i, chartChunks.length), state, `图表页 ${i + 1}`);
          }
        } else {
          updatePdfStatus(button, '生成空图表页...');
          await addElementAsPdfPage(doc, host, createPdfPage('', '<div class="pdf-empty">当前筛选条件下暂无可导出的图表</div>', '图表'), state, '空图表页');
        }

        const statChunks = chunkArray(chartDefs, 4);
        for (let i = 0; i < statChunks.length; i++) {
          updatePdfStatus(button, `生成统计 ${i + 1}/${statChunks.length}...`);
          await addElementAsPdfPage(doc, host, buildStatsPage(statChunks[i], data, i, statChunks.length), state, `统计页 ${i + 1}`);
        }

        const tableChunks = chunkArray(data, 12);
        const tablePages = tableChunks.length || 1;
        for (let i = 0; i < tablePages; i++) {
          updatePdfStatus(button, `生成记录 ${i + 1}/${tablePages}...`);
          await addElementAsPdfPage(doc, host, buildResponseTablePage(tableChunks[i] || [], i, tablePages, data.length), state, `记录页 ${i + 1}`);
        }

        const detailChunks = chunkArray(data, 2);
        for (let i = 0; i < detailChunks.length; i++) {
          updatePdfStatus(button, `生成附录 ${i + 1}/${detailChunks.length}...`);
          await addElementAsPdfPage(doc, host, buildDetailPage(detailChunks[i], i, detailChunks.length), state, `附录页 ${i + 1}`);
        }

        updatePdfStatus(button, '保存 PDF...');
        doc.save(`crosspilot-survey-report-${new Date().toISOString().slice(0, 10)}.pdf`);
      } catch (err) {
        console.error(err);
        alert(`PDF 导出失败：${err.message || err}`);
      } finally {
        if (host) host.remove();
        if (button) {
          button.disabled = false;
          button.textContent = originalText;
        }
      }
    }

    function download(content, filename, type) {
      const url = URL.createObjectURL(new Blob([content], { type }));
      const a = document.createElement('a');
      a.href = url;
      a.download = filename;
      a.click();
      URL.revokeObjectURL(url);
    }

    // CRUD
    function deleteOne(id) {
      if (!confirm('确定删除这条数据？')) return;
      window.CrossPilotData.deleteResponse(id).then(loadData).catch(err => alert('删除失败'));
    }

    function clearAll() {
      if (!confirm('确定清空所有数据？此操作不可撤销！')) return;
      if (!confirm('再次确认：删除全部数据？')) return;
      window.CrossPilotData.clearResponses(allResponses).then(loadData).catch(err => alert('清空失败'));
    }

    function loadData() {
      window.CrossPilotData.loadResponses().then(data => {
        allResponses = data.responses || [];
        renderAll();
      }).catch(err => {
        document.getElementById('total-count').textContent = '加载失败';
      });
    }

    // Auth
    function handleLogin() {
      const email = document.getElementById('admin-email').value.trim();
      const password = document.getElementById('admin-password').value;
      const errorEl = document.getElementById('auth-error');

      if (!email || !password) {
        errorEl.textContent = '请输入邮箱和密码';
        errorEl.classList.remove('hidden');
        return;
      }

      errorEl.classList.add('hidden');
      const btn = document.getElementById('btn-login');
      btn.disabled = true;
      btn.textContent = '登录中...';

      window.CrossPilotData.login(email, password)
        .catch(err => {
          errorEl.textContent = err.message || '登录失败';
          errorEl.classList.remove('hidden');
        })
        .finally(() => {
          btn.disabled = false;
          btn.textContent = '登录';
        });
    }

    // Init
    window.CrossPilotData.onAuthChange(user => {
      if (!window.CrossPilotData.supabaseEnabled()) {
        document.getElementById('auth-panel').classList.add('hidden');
        document.getElementById('main-content').classList.remove('hidden');
        loadData();
        return;
      }

      if (window.CrossPilotData.isAllowedAdmin(user)) {
        document.getElementById('auth-panel').classList.add('hidden');
        document.getElementById('main-content').classList.remove('hidden');
        loadData();
      } else {
        document.getElementById('auth-panel').classList.remove('hidden');
        document.getElementById('main-content').classList.add('hidden');
      }
    });

    // Auto-refresh
    setInterval(loadData, 30000);
  </script>
</body>
</html>
